name: Documentation

on:
  push:
    branches: [main]
    paths: ['docs/**', 'forwarder/icon-source.png', 'tools/build_docs.py', 'tests/test_build_docs.py', 'zensical.toml', 'requirements-docs.txt', 'config/package-inputs.json', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'forwarder/icon-source.png', 'tools/build_docs.py', 'tests/test_build_docs.py', 'zensical.toml', 'requirements-docs.txt', 'config/package-inputs.json', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-docs.txt
      - run: python -m unittest tests.test_build_docs
      - run: python tools/build_docs.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: build/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
