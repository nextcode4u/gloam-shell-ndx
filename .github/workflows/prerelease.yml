name: Prepare prerelease

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: New preview/rc version (for example v0.1.0-preview.1)
        required: true
        type: string
      addons:
        description: Include reviewed add-ons and matching source/notices
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml
    with:
      include_addons: ${{ inputs.addons }}

  prepare:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gloam-packages
          path: dist
      - name: Verify downloaded release set
        env:
          WITH_ADDONS: ${{ inputs.addons }}
        run: |
          python3 - <<'PY'
          import os
          from tools.verify_release import verify
          verify('dist', addons=os.environ['WITH_ADDONS'] == 'true')
          PY
      - name: Create a draft for final review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import subprocess
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+-(preview|rc)\.[0-9]+', tag):
              raise SystemExit('Use a new preview/rc version tag')
          version = re.search(r'#define GLOAM_VERSION "([^"\n]+)"',
                              Path('arm9/include/update_checker.h').read_text())
          if not version or version[1] != tag:
              raise SystemExit('Bump GLOAM_VERSION to the release tag before building the release.')
          source = os.environ['SOURCE_COMMIT']
          notes = Path('dist/prerelease-notes.md')
          notes.write_text(
              f'Gloam Shell NDX {tag}\n\nSource commit: {source}.\n\n'
              'Development preview; physical DSi validation remains pending. '
              'See docs/CURRENT_SUPPORT.md for launch/backend compatibility limits.\n\n'
              'BOOT.NDS updates only the frontend. sd.zip supplies full SD setup; '
              'preserve existing settings and saves. addons.zip, when included, '
              'contains only the reviewed redistributable subset and shared downloaders.\n\n'
              'Keep licenses.zip, source.zip and SHA256SUMS alongside the binary downloads. '
              'No games, proprietary external BIOS, NAND or user data are supplied.\n')
          names = [line.split('  ', 1)[1] for line in Path('dist/SHA256SUMS').read_text().splitlines()]
          files = [str(Path('dist') / name) for name in names] + ['dist/SHA256SUMS']
          subprocess.run(['gh', 'release', 'create', tag, *files, '--target', source,
                          '--title', f'Gloam Shell NDX {tag}', '--notes-file', str(notes),
                          '--draft', '--prerelease'], check=True)
          PY

  retain-current-preview:
    if: github.event_name == 'release' && github.event.release.prerelease && !github.event.release.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify published preview before removing older previews
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          from datetime import datetime
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          from tools.verify_release import verify

          pattern = r'v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+'
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(pattern, tag):
              raise SystemExit(0)
          repo = os.environ['GITHUB_REPOSITORY']
          subprocess.run(['gh', 'release', 'download', tag, '--repo', repo,
                          '--dir', 'dist'], check=True)
          verify('dist', addons=Path('dist/addons.zip').is_file())
          pages = json.loads(subprocess.check_output(
              ['gh', 'api', '--paginate', '--slurp', f'repos/{repo}/releases']))
          releases = [release for page in pages for release in page]
          current = next(release for release in releases if release['tag_name'] == tag)
          if current['draft'] or not current['prerelease']:
              raise SystemExit('Current preview is not a published prerelease')
          published = datetime.fromisoformat(current['published_at'].replace('Z', '+00:00'))
          for release in releases:
              old_tag = release['tag_name']
              if (old_tag == tag or release['draft'] or not release['prerelease']
                      or not re.fullmatch(pattern, old_tag)):
                  continue
              old_date = datetime.fromisoformat(release['published_at'].replace('Z', '+00:00'))
              if old_date < published:
                  subprocess.run(['gh', 'release', 'delete', old_tag, '--repo', repo,
                                  '--yes'], check=True)
          PY
