setting.interface_language.help=Kies een taalcatalogus op SD. Custom gebruikt language.ini; English slaat dit over. Ontbrekende teksten en herstel gebruiken Engels.
setting.icon_labels.help=Toon namen naast pictogrammen onderaan. De lijst behoudt namen. De informatie op het bovenste scherm blijft zichtbaar. Afzonderlijk opgeslagen voor dit tabblad.
setting.icons.help=Kies kleine, middelgrote of grote pictogrammen. De lijst verbergt pictogrammen. Hoezen blijven ongewijzigd. Afzonderlijk opgeslagen voor dit tabblad.
setting.motion.help=Verminder themabeweging en zet bewegende pictogrammen stil. Bladeren blijft beschikbaar.
setting.music_mode.help=Zet muziek uit, speel de themamuziek of een eigen WAV. In herstel blijft muziek uit.
setting.music_volume.help=Muziekvolume, los van thema-effecten. Nul dempt de muziek.
setting.effects.help=Gebruik de themageluiden voor selectie, bevestigen en terug, indien aanwezig.
setting.effects_volume.help=Volume van interfacegeluiden, los van de achtergrondmuziek.
setting.covers.help=Toon de hoes van het geselecteerde item bovenaan. Uit toont informatie zonder hoezen te decoderen.
setting.hidden.help=Toon verborgen namen en FAT-bestanden. De navigatie-items . en .. blijven uitgesloten.
setting.hide_saves.help=Verberg opslagmappen in de browser. Bestanden worden niet gewist of verplaatst.
setting.hide_bios.help=Verberg BIOS-mappen in de browser. Emulators kunnen de bestanden nog lezen.
setting.extensions.help=Verberg alleen de getoonde extensie. Paden, koppelingen en opslagbestanden blijven gelijk.
setting.background_updates.help=Controleer gepubliceerde versies na het opstarten via opgeslagen wifi. Eenmaal per dag, zonder automatisch downloaden. Uitschakelen annuleert de controle.
setting.check_updates.help=Plan een controle bij inactiviteit. Een pijl betekent een nieuwere versie. Werk bij via PC-setup of GitHub Releases; instellingen en saves blijven behouden.
setting.splash_mode.help=Kies geen intro, de thema-intro of een eigen pakket. Het thema kan de standaardintro gebruiken. Herstel slaat intro's over.
setting.splash_path.help=Kies een voorbereid .gsp-pakket op SD. Activeert Custom zonder het thema te wijzigen.
setting.splash_once.help=Tijdens laden wacht niet op het einde. Eenmaal afspelen voltooit de intro vóór de browser. Elke knop slaat deze over.
setting.splash_sound.help=Speel optioneel introgeluid op effectvolume. Het stopt vóór de themamuziek. Minder beweging blijft stil.
setting.splash_preview.help=Speel de gekozen intro nu. Elke knop keert terug. Het voorbeeld wijzigt geen instellingen.
setting.save.help=Sla instellingen nu op. Bij fouten blijven wijzigingen niet opgeslagen en verschijnt een melding.
setting.accent.help=Kies een eigen accentkleur. Het geïnstalleerde thema blijft ongewijzigd.
setting.clock.help=Kies 12- of 24-uursnotatie. Wijzigt de weergave in Gloam, niet de consoleklok.
setting.view.help=Kies een weergave. Lijst verbergt pictogrammen; Raster, Plank en Index tonen dezelfde bestanden op andere manieren. Afzonderlijk opgeslagen voor dit tabblad.
setting.theme.help=Kies een thema en laad met X het voorbeeld. Als het klaar is past A het toe; B annuleert. Herstel gebruikt ingebouwde beelden.
dialog.game_slot.help=Vak 0 gebruikt herkende saves. 1-9 gebruiken aparte .savN-bestanden, of .pubN/.prvN voor DSiWare. Bestaande saves worden niet vervangen.
dialog.why_handler=Waarom deze toepassing?
dialog.search_library=Bibliotheek doorzoeken
dialog.search_hint=B terug  X tekst  SEL bereik

setting.top_content.label=Bovenste scherm

dialog.game_async.help=Asynchroon lezen hangt af van de backend. Auto behoudt de standaard. Zet dit uit bij het onderzoeken van laadproblemen.
dialog.game_cpu.help=CPU-boost vraagt de snellere DSi-klok aan via nds-bootstrap. Rechtstreeks gestarte emulators worden niet gewijzigd.
dialog.game_dma.help=DMA regelt het lezen van ROMs door de backend. Zet dit uit bij het onderzoeken van laadproblemen.
dialog.game_hotkey.help=Opent het spelmenu van nds-bootstrap. Terugkeren hangt af van spel en backend; QUIT_PATH verwijst naar BOOT.NDS.
dialog.game_language.help=Taal van het spel, indien ondersteund. Dit verandert de taal van Gloam en het spelmenu niet.
dialog.game_manual.help=De .txt-handleiding is Game.txt naast Game.nds. Ontbrekende of lege bestanden wissen het oude pad. Uit wist het; INI behouden laat het ongewijzigd.
dialog.game_mode.help=DS- of DSi-modus van de backend. Auto behoudt de standaard. Deze keuze voegt geen ontbrekende hardwarefuncties toe.
dialog.game_overlay_language.help=Taal van het spelmenu van nds-bootstrap, los van het spel. INI behouden gebruikt de opgeslagen waarde of de backendstandaard.
dialog.game_screen_swap.help=Houd deze combinatie vast om via nds-bootstrap de schermen te wisselen. INI behouden gebruikt de opgeslagen combinatie of L+R+Omhoog+X.
dialog.game_size.help=Auto gebruikt bekende DS-opslaggroottes of de DSiWare-header. Kies een grootte voor onbekende DS-spellen. Bestaande saves worden nooit vergroot of verkleind.
dialog.game_vram.help=VRAM-boost is een backendoptie. Auto behoudt de standaard; sommige spellen vereisen dat deze uit staat.
setting.about.help=BlocksDS-frontend voor homebrew, audio en thema's. DS-spellen starten, opslaan en terugkeren zijn op DSi getest.
setting.audio.help=Ontbrekende of niet-ondersteunde audio blijft stil. Bladeren blijft mogelijk.
setting.auto_launch.help=Standaard uit. Een aftelling opent bij de volgende start het laatste item. Elke invoer annuleert; SELECT-herstel slaat dit over. Test het item eerst handmatig.
setting.battery.help=Ruwe batterijwaarde (0-15) en laadstatus. Dit is geen percentage.
setting.bottom_background.help=Kies een eigen afbeelding voor het aanraakscherm. Knoppen en aanraakgebieden houden hun plaats.
setting.brightness.help=Achtergrondverlichting van 1 tot 5. Op DSi wordt dit als console-instelling opgeslagen, los van het thema.
setting.cheats.help=Kies usrcheat.dat-codes voor de juiste spelversie. De database blijft ongewijzigd. Effecten hangen af van code en spel; zie de cheatgids.
setting.clear_caches.help=Wis voorbereide pictogrammen en afbeeldingscaches. Bronafbeeldingen, toewijzingen en saves blijven op de SD.
setting.clear_recent.help=Wis de geschiedenis van startverzoeken. Favorieten, inhoud en saves blijven behouden.
setting.config_export.help=Exporteer instellingen en toewijzingen naar configuration/export.dsconfig. Apps, afbeeldingen en saves zijn niet inbegrepen.
setting.config_import.help=Controleer een .dsconfig-bestand en bevestig. Huidige instellingen worden eerst geback-upt. Niet beschikbaar in herstelmodus.
setting.dashboard.help=Toon, verberg, orden en begrens Home-secties. L/R wijzigt het aantal items. Instellingen blijven toegankelijk.
setting.diagnostics.help=Schrijf runtimegegevens naar _nds/dsi-frontend/diagnostics.txt. BIOS, NAND, sleutels en inhoudsbestanden worden niet geëxporteerd.
setting.environment.help=Gedetecteerde DS/DSi-modus. Dit bepaalt niet welke bootloader actief is of welke systeemtitels werken.
setting.filter.help=Toon alle bestanden of herkende spellen, media en documenten. Coverafbeeldingen blijven verborgen.
setting.launch.help=Directe DSi-SD-homebrew en argv worden ondersteund. Terugkeren vereist een geschikte app; zie de startgids.
setting.loaders.help=Standaarden voor nds-bootstrap, saveslots en menutoetsen. Starten, opslaan en terugkeren zijn op DSi getest; ondersteuning verschilt per spel.
setting.music_path.help=Kies mono PCM16-WAV van 8-48 kHz, maximaal 1 MiB. De muziek herhaalt zonder een andere app.
setting.preset_load.help=Pas de gekozen vormgeving toe. Navigatie, spelopties, toewijzingen en saves blijven ongewijzigd.
setting.preset_save.help=Bewaar de huidige vormgeving in het gekozen slot. De vorige versie blijft als back-up behouden.
setting.preset_slot.help=Kies Everyday, Evening of Travel. Elk slot bewaart thema, achtergronden, pictogrammen, weergave en leesbaarheid.
setting.profiles.help=INI-profielen bepalen pictogrammen en apps. Bewerk hier persoonlijke bestandsextensies.
setting.refresh.help=Herlaad thema's, toewijzingen en deze map; wis afbeeldingscache. De selectie blijft behouden als deze nog zichtbaar is.
setting.reset_appearance.help=Herstel de ingebouwde vormgeving. Thema's en bronafbeeldingen blijven op de SD.
setting.reset_browser.help=Herstel sortering, zichtbaarheid, extensies, titeltaal en scrolsnelheid. Bibliotheken, tabs, favorieten en vormgeving blijven behouden.
setting.reset_configuration.help=Herstel instellingen en toewijzingen. Bevestig nogmaals met A. Oude instellingen worden gearchiveerd; apps, saves, thema's en afbeeldingen blijven behouden.
setting.reset_wallpapers.help=Verwijder persoonlijke achtergrondkeuzes en gebruik die van het thema. Afbeeldingen en thema's worden niet gewist.
setting.route_camera.help=Controleer Camera en de startroute. Het gedrag hangt af van de opstartomgeving. A vernieuwt de detectie.
setting.route_direct.help=Direct starten vanaf DSi-SD. argv en terugkeren hangen af van de app. A controleert de routes opnieuw.
setting.route_download.help=Controleer DS Download Play en de startroute. Draadloos overdragen vereist geschikte deelnemers en aparte tests. A vernieuwt de detectie.
setting.route_homebrew.help=Controleert /_nds/nds-bootstrap-hb-release.nds voor profielen die dit gebruiken. De meeste apps starten direct. A vernieuwt de controle.
setting.route_menu.help=Controleert het DSi-menu en eventueel nand:/launcher.dsi. NAND-opstartinstellingen worden niet gewijzigd. A vernieuwt.
setting.route_picto.help=Controleer PictoChat en de startroute. Lokaal draadloos gebruik vereist geschikte firmware en deelnemers. A vernieuwt.
setting.route_retail.help=Controleert /_nds/nds-bootstrap-release.nds. Aanwezig betekent geïnstalleerd, niet getest met elk spel. A vernieuwt.
setting.route_settings.help=Open geïnstalleerde instellingen via het DSi-menu. Gepatchte menu's kunnen na het starten nog een toets vereisen. A vernieuwt.
setting.route_slot1.help=Controleer hulpprogrammapaden en het gekozen bestand. Een spelkaart blijft vereist. A vernieuwt.
setting.route_sound.help=Controleer Geluid en de startroute. Afspelen en opnemen hangen af van de opstartomgeving. A vernieuwt.
setting.settings_mode.help=Eenvoudig toont dagelijkse opties. Geavanceerd voegt start- en onderhoudsopties toe. Wisselen behoudt je instellingen.
setting.sleep.help=Automatische slaapstand bij sluiten is actief. Ontwaken, beeld, invoer en muziek zijn op DSi getest. Andere apparaten moeten nog worden getest.
setting.sort.help=Mappen eerst, daarna bestanden op naam, extensie of wijzigingsdatum. De selectie volgt het pad.
setting.speed.help=Wijzig de herhaalsnelheid van ingedrukte richtingsknoppen en L/R. Losse drukken blijven direct.
setting.startup.help=Open bij de volgende start de laatste of een gekozen tab. Dit start geen spel of app.
setting.system.help=Open de tab Systeem. De beschikbaarheid van elke startroute wordt apart getoond.
setting.system_files.help=Toon bestanden met het FAT-systeemkenmerk. Dit schakelt bewerken of verwijderen niet in.
setting.system_menu.help=Keer terug via het geïnstalleerde DSi-menu. Een gevalideerd taalgepatcht menu krijgt voorrang. Volg op gepatchte consoles de melding.
setting.tabs.help=Bewerk bibliotheekmappen en tabs in _nds/dsi-frontend/tabs.ini en herstart. ID's behouden opgeslagen navigatie.
setting.title_language.help=Kies de interne titeltaal, met Engels en dan Japans als terugval. Dit vertaalt spel of interface niet; Japanse tekens werken los van het thema.
setting.title_source.help=Toon bestandsnamen of op aanvraag geladen DS-titels. Sorteren en starten gebruiken de echte bestandsnaam.
setting.toolchain.help=SDK-versie van deze build. Details staan in docs/development/TOOLCHAIN.md.
setting.top_background.help=Kies een PNG/JPEG op SD. Persoonlijke achtergronden blijven bij themawissels behouden; bronbestanden wijzigen niet.
setting.top_content.help=Thema volgt het ontwerp. Buren toont nabije covers. Smart past zich aan de inhoud aan. Y opent details.
setting.unlaunch.help=Open je eigen installatieprogramma voor startscherm, menugeluid en opstartopties. De instellingen daarvan staan los van Gloam.
setting.wall_strength.help=Themastandaard, Uit of beeldsterkte 5-35 procent. Rustige achtergronden houden tekst leesbaar.
