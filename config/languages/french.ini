setting.interface_language.help=Choisir un catalogue sur SD. Custom lit language.ini ; English l'ignore. Les traductions absentes et le mode de récupération utilisent l'anglais.
setting.icon_labels.help=Afficher les noms près des icônes sur l'écran du bas. La vue Liste garde ses noms. Les informations sur l'écran du haut restent visibles. Enregistré séparément pour cet onglet.
setting.icons.help=Choisir de petites, moyennes ou grandes icônes. La vue Liste masque les icônes. Cela ne change pas les jaquettes. Enregistré séparément pour cet onglet.
setting.motion.help=Réduire les animations du thème et figer les icônes animées. La navigation reste disponible.
setting.music_mode.help=Désactiver la musique, lire celle du thème ou un WAV personnel. La récupération reste silencieuse.
setting.music_volume.help=Volume de la musique, indépendant des sons du thème. Zéro coupe la musique.
setting.effects.help=Utiliser les sons de déplacement, de validation et de retour fournis par le thème.
setting.effects_volume.help=Volume des sons de l'interface, indépendant de la musique de fond.
setting.covers.help=Afficher la jaquette de l'élément sélectionné en haut. Non affiche les informations sans décoder de jaquette.
setting.hidden.help=Afficher les fichiers cachés par leur nom ou par FAT. Les entrées de navigation . et .. restent exclues.
setting.hide_saves.help=Masquer les dossiers de sauvegardes dans le navigateur. Aucun fichier n'est supprimé ni déplacé.
setting.hide_bios.help=Masquer les dossiers BIOS dans le navigateur. Les émulateurs peuvent toujours lire leurs fichiers.
setting.extensions.help=Masquer seulement l'extension affichée. Les chemins, associations et sauvegardes ne changent pas.
setting.background_updates.help=Rechercher une version publiée après le démarrage avec le Wi-Fi enregistré. Une fois par jour, sans téléchargement automatique. Désactiver annule la recherche.
setting.check_updates.help=Mettre une recherche en attente. Une flèche signale une version plus récente. Mettre à jour avec l'outil PC ou GitHub Releases ; réglages et sauvegardes sont conservés.
setting.splash_mode.help=Désactiver l'intro, utiliser celle du thème ou un paquet personnel. Le thème peut utiliser l'intro par défaut. La récupération ignore les intros.
setting.splash_path.help=Choisir un paquet .gsp sur SD. Active le mode Custom sans modifier le thème.
setting.splash_once.help=Pendant le chargement n'attend pas la fin de l'animation. Lire une fois termine l'intro avant le navigateur. Une touche permet de passer.
setting.splash_sound.help=Lire le son facultatif de l'intro au volume des effets. Il s'arrête avant la musique. Les animations réduites restent silencieuses.
setting.splash_preview.help=Lire l'intro maintenant. Une touche revient ici. L'aperçu ne modifie pas les réglages.
setting.save.help=Enregistrer les réglages maintenant. En cas d'échec, les modifications restent non enregistrées et une erreur est affichée.
setting.accent.help=Choisir un accent personnel. Le thème installé reste inchangé.
setting.clock.help=Choisir le format 12 ou 24 heures. Change l'affichage de Gloam, pas l'horloge de la console.
setting.view.help=Choisir une présentation. Liste masque les icônes ; Grille, Étagère et Index proposent d'autres façons de parcourir les mêmes fichiers. Enregistré séparément pour cet onglet.
setting.theme.help=Choisir un thème puis X pour charger sa prévisualisation. Une fois prêt, A applique et B annule. La récupération utilise les ressources intégrées.
dialog.game_slot.help=L'emplacement 0 réutilise les sauvegardes reconnues. 1-9 utilisent des fichiers .savN séparés, ou .pubN/.prvN pour DSiWare. Les sauvegardes existantes ne sont pas remplacées.
dialog.why_handler=Pourquoi cette application ?
dialog.search_library=Chercher dans la bibliothèque
dialog.search_hint=B retour  X saisir  SEL portée

setting.top_content.label=Écran supérieur

dialog.game_async.help=Les lectures asynchrones dépendent du moteur. Auto garde sa valeur par défaut. Les désactiver pour tester un problème de chargement.
dialog.game_cpu.help=Le boost CPU demande la fréquence DSi plus rapide via nds-bootstrap. Il ne change pas les émulateurs lancés directement.
dialog.game_dma.help=Le DMA gère les lectures de ROM du moteur. Le désactiver pour tester un problème de chargement.
dialog.game_hotkey.help=Ouvre le menu en jeu de nds-bootstrap. Le retour dépend du jeu et du moteur ; QUIT_PATH pointe vers BOOT.NDS.
dialog.game_language.help=Langue du jeu, si elle est prise en charge. Ne change ni la langue de Gloam ni celle du menu en jeu.
dialog.game_manual.help=Le manuel .txt est Game.txt à côté de Game.nds. Un fichier absent ou vide efface l'ancien chemin. Désactivé l'efface ; Garder INI le conserve.
dialog.game_mode.help=Mode DS ou DSi du moteur. Auto garde sa valeur par défaut. Ce choix n'ajoute pas de fonctions matérielles absentes.
dialog.game_overlay_language.help=Langue du menu en jeu de nds-bootstrap, indépendante du jeu. Garder INI conserve la valeur enregistrée ou celle du moteur.
dialog.game_screen_swap.help=Maintenir cette combinaison pour inverser les écrans via nds-bootstrap. Garder INI utilise le réglage enregistré ou L+R+Haut+X.
dialog.game_size.help=Auto utilise les tailles DS connues ou celles de l'en-tête DSiWare. Indiquer la taille pour un jeu DS inconnu. Les sauvegardes existantes ne sont jamais redimensionnées.
dialog.game_vram.help=Le boost VRAM est une option du moteur. Auto garde sa valeur par défaut ; certains jeux nécessitent de le désactiver.
setting.about.help=Interface BlocksDS pour homebrews, audio et thèmes. Le lancement DS, les sauvegardes et le retour ont été testés sur DSi.
setting.audio.help=Un fichier audio absent ou non pris en charge reste silencieux. La navigation reste disponible.
setting.auto_launch.help=Désactivé par défaut. Au prochain démarrage, un compte à rebours lance le dernier titre. Une touche annule ; la récupération SELECT l'ignore. Tester le titre manuellement avant.
setting.battery.help=Niveau brut de batterie (0-15) et état de charge. Il ne s'agit pas d'un pourcentage.
setting.bottom_background.help=Choisir une image pour l'écran tactile. Les commandes et zones tactiles gardent leur position.
setting.brightness.help=Rétroéclairage de 1 à 5. Sur DSi, ce réglage est enregistré dans la console, indépendamment du thème.
setting.cheats.help=Choisir les codes usrcheat.dat adaptés à la version du jeu. La base reste inchangée. Les effets dépendent du code et du titre ; voir le guide des codes.
setting.clear_caches.help=Effacer les icônes préparées et les caches d'images. Images originales, associations et sauvegardes restent sur la SD.
setting.clear_recent.help=Effacer l'historique des lancements. Favoris, contenus et sauvegardes restent en place.
setting.config_export.help=Exporter les réglages et associations dans configuration/export.dsconfig. Applications, images et sauvegardes ne sont pas incluses.
setting.config_import.help=Vérifier une archive .dsconfig puis confirmer. Les réglages actuels sont sauvegardés avant l'importation. Indisponible en récupération.
setting.dashboard.help=Afficher, masquer, réordonner et limiter les sections d'accueil. L/R règle le nombre d'éléments. Les réglages restent accessibles.
setting.diagnostics.help=Écrire les données de fonctionnement dans _nds/dsi-frontend/diagnostics.txt. Aucun BIOS, NAND, clé ou fichier de contenu n'est exporté.
setting.environment.help=Mode d'exécution DS/DSi détecté. Il n'identifie ni le chargeur de démarrage ni la compatibilité des titres système.
setting.filter.help=Afficher tous les fichiers ou les jeux, médias et documents reconnus. Les images de couverture restent masquées.
setting.launch.help=Lancement direct DSi-SD et argv pris en charge. Le retour nécessite une application compatible ; voir le guide de lancement.
setting.loaders.help=Réglages nds-bootstrap, emplacements de sauvegarde et touches du menu. Lancement, sauvegarde et retour testés sur DSi ; la compatibilité varie selon le titre.
setting.music_path.help=Choisir un WAV PCM16 mono de 8-48 kHz, jusqu'à 1 Mio. La piste tourne en boucle sans autre application.
setting.preset_load.help=Appliquer l'apparence choisie. Navigation, options des jeux, associations et sauvegardes restent en place.
setting.preset_save.help=Enregistrer l'apparence dans l'emplacement choisi. La version précédente reste en sauvegarde.
setting.preset_slot.help=Choisir Everyday, Evening ou Travel. Chaque emplacement garde thème, fonds, icônes, vue et lisibilité.
setting.profiles.help=Les profils INI définissent icônes et applications. Modifier ici les associations personnelles d'extensions.
setting.refresh.help=Recharger thèmes, associations et dossier ; effacer le cache d'images. Garder l'élément sélectionné s'il est encore visible.
setting.reset_appearance.help=Rétablir l'apparence intégrée. Les thèmes et images originales restent sur la SD.
setting.reset_browser.help=Rétablir tri, visibilité, extensions, langue des titres et défilement. Bibliothèques, onglets, favoris et apparence restent en place.
setting.reset_configuration.help=Réinitialiser réglages et associations. Confirmer encore avec A. Les anciens réglages sont archivés ; applications, sauvegardes, thèmes et images restent en place.
setting.reset_wallpapers.help=Retirer les fonds personnels et utiliser ceux du thème. Aucune image ni aucun thème n'est supprimé.
setting.route_camera.help=Détecter l'appareil photo et sa voie de lancement. Le résultat dépend du démarrage de la console. A actualise la détection.
setting.route_direct.help=Lancement direct depuis la SD du DSi. argv et retour dépendent de l'application. A vérifie de nouveau les voies disponibles.
setting.route_download.help=Détecter le Téléchargement DS et sa voie de lancement. Le transfert sans fil exige des partenaires compatibles et des tests séparés. A actualise.
setting.route_homebrew.help=Vérifie /_nds/nds-bootstrap-hb-release.nds pour les profils concernés. La plupart des applications démarrent directement. A actualise.
setting.route_menu.help=Vérifier le menu DSi et, si présent, nand:/launcher.dsi. Les réglages de démarrage NAND ne sont pas modifiés. A actualise.
setting.route_picto.help=Détecter PictoChat et sa voie de lancement. Le sans-fil local nécessite un firmware et des partenaires compatibles. A actualise.
setting.route_retail.help=Vérifie /_nds/nds-bootstrap-release.nds. Présent signifie installé, pas compatible avec tous les jeux. A actualise.
setting.route_settings.help=Ouvrir les paramètres installés via le menu DSi. Un menu modifié peut demander une autre touche après le lancement. A actualise.
setting.route_slot1.help=Vérifier les chemins de l'utilitaire et le programme choisi. Une cartouche reste nécessaire. A actualise.
setting.route_sound.help=Détecter le studio son et sa voie de lancement. Lecture et enregistrement dépendent du démarrage de la console. A actualise.
setting.settings_mode.help=Simple affiche les options courantes. Avancé ajoute lancement, démarrage et entretien. Changer de vue conserve les réglages.
setting.sleep.help=La veille à la fermeture est active. Réveil, affichage, commandes et musique testés sur DSi. D'autres appareils restent à vérifier.
setting.sort.help=Dossiers en premier, puis fichiers par nom, extension ou date. La sélection suit son chemin.
setting.speed.help=Régler la répétition des directions et de L/R maintenus. Une pression simple reste immédiate.
setting.startup.help=Ouvrir le dernier onglet ou un onglet choisi au prochain démarrage. Aucun titre n'est lancé.
setting.system.help=Ouvrir l'onglet Système. Chaque voie de lancement indique sa disponibilité séparément.
setting.system_files.help=Afficher les fichiers portant l'attribut système FAT. Cela n'autorise ni leur modification ni leur suppression.
setting.system_menu.help=Revenir par le menu DSi installé. Un menu traduit validé est prioritaire. Suivre l'avertissement sur les consoles modifiées.
setting.tabs.help=Modifier racines et onglets dans _nds/dsi-frontend/tabs.ini, puis redémarrer. Les identifiants conservent la navigation enregistrée.
setting.title_language.help=Choisir la langue des titres internes, avec repli anglais puis japonais. Ne traduit ni le jeu ni l'interface ; les glyphes japonais sont indépendants du thème.
setting.title_source.help=Afficher les noms de fichiers ou les titres DS chargés à la demande. Tri et lancement utilisent toujours le vrai nom du fichier.
setting.toolchain.help=Version du SDK de cette compilation. Détails dans docs/development/TOOLCHAIN.md.
setting.top_background.help=Choisir un PNG/JPEG sur SD. Les fonds personnels survivent aux changements de thème ; les originaux restent inchangés.
setting.top_content.help=Thème suit son design. Voisins montre les couvertures proches. Smart s'adapte au contenu. Y ouvre les détails.
setting.unlaunch.help=Ouvrir votre installateur pour avertissement initial, son du menu et démarrage. Ses réglages sont séparés de ceux de Gloam.
setting.wall_strength.help=Valeur du thème, désactivé ou intensité de 5-35 %. Un fond discret préserve la lisibilité.
