setting.title_language.help=内部バナーの言語を選びます。ない場合は英語、次に日本語を使います。ゲームや画面の翻訳ではありません。日本語文字はテーマに関係なく表示できます。
setting.settings_mode.help=かんたん設定は日常の項目を表示し、詳細設定は起動や保守の項目も表示します。切り替えても既存の設定値は残ります。
dialog.game_mode.help=起動先のDSまたはDSiモードです。自動は既定値を使います。選択だけで未対応の機能が使えるようにはなりません。
dialog.game_cpu.help=nds-bootstrap経由で高速なDSiのCPU動作を要求します。直接起動したエミュレーターには影響しません。
dialog.game_vram.help=VRAM高速化は起動先の設定です。自動は既定値を使います。オフが必要なゲームもあります。
dialog.game_dma.help=カードDMAは起動先のROM読み込み方法を制御します。読み込みの問題を調べる際はオフを試してください。
dialog.game_async.help=非同期読み込みは起動方式に依存します。自動は既定値を使います。読み込みに問題がある場合はオフを試してください。
dialog.game_language.help=対応ゲームに渡す言語です。Gloamやゲーム内メニューの表示言語とは別の設定です。
dialog.game_slot.help=スロット0は既存のセーブを使います。1〜9は別のファイルです。DSiウェアは公開用と非公開用の保存領域を使います。
dialog.game_size.help=自動は既知のDSセーブ容量かDSiウェアのヘッダー値を使います。不明なDSゲームは容量指定が必要です。既存セーブの容量は変更しません。
dialog.game_hotkey.help=nds-bootstrapのゲーム内メニューを開きます。復帰はゲームと起動先の対応次第です。QUIT_PATHはBOOT.NDSを指します。

