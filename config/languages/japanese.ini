; Context help.
dialog.game_manual.help=Game.ndsと同じ場所のGame.txtを説明書に使います。ファイルがないか空なら古いパスを消去します。オフも消去し、INI保持は変更しません。
dialog.game_overlay_language.help=nds-bootstrapのゲーム内メニューの言語です。ゲームの言語とは別です。INI保持は保存済みの値か既定値を使います。
dialog.game_screen_swap.help=このキーを押し続けると上下画面を入れ替えます。INI保持は保存済みの組合せか、既定のL+R+上+Xを使います。
setting.about.help=BlocksDS製のホーム画面です。自作ソフト、音声、テーマに対応します。DSゲームの起動、セーブ、復帰はDSi実機で確認済みです。
setting.accent.help=テーマを変更せず、個人用のアクセント色を上書きします。
setting.audio.help=音声ファイルがない場合や未対応の場合は無音になります。ファイルの閲覧は続けられます。
setting.auto_launch.help=通常起動時、カウント後に最後のタイトルを起動します。初期値はオフです。入力すると中止します。SELECT復旧時は実行しません。先に手動で動作確認してください。
setting.background_updates.help=起動後、保存済みWi-FiでGloamの更新を1日1回確認します。自動ダウンロードは行いません。オフにすると確認を中止します。
setting.battery.help=本体から得た電池残量の値（0-15）と充電状態です。パーセント表示ではありません。
setting.bottom_background.help=下画面用の画像を選びます。操作ボタンやタッチ領域の位置は変わりません。
setting.brightness.help=明るさを1から5で設定します。DSiではテーマの色とは別に、本体の設定として保存されます。
setting.cheats.help=ゲームの版に合うusrcheat.datの項目を選びます。データベースは変更しません。効果はコードとタイトルに依存します。チートガイドも参照してください。
setting.check_updates.help=操作が止まってから更新を確認します。矢印は新版の通知です。PC設定ツールかGitHub Releasesで更新してください。設定やセーブは変更しません。
setting.clear_caches.help=アイコンや画像のキャッシュを消去します。元画像、割り当て、ゲームのセーブはSDに残ります。
setting.clear_recent.help=最近起動した項目の履歴を消去します。お気に入り、コンテンツ、セーブは残ります。
setting.clock.help=12時間または24時間表示を選びます。本体の時計の設定は変更しません。
setting.config_export.help=設定、タブ、履歴、割り当てなどをconfiguration/export.dsconfigに保存します。アプリ、画像、セーブは含みません。
setting.config_import.help=.dsconfigを確認してから読み込みます。現在の設定は事前にバックアップします。復旧モードでは使えません。
setting.covers.help=選んだ項目のカバーを上画面に表示します。オフでは項目情報を表示し、カバーの読み込みを省きます。
setting.dashboard.help=ホームの項目を表示、非表示、並べ替えできます。L/Rで件数を変更します。設定画面は常に開けます。
setting.diagnostics.help=実行時の情報を_nds/dsi-frontend/diagnostics.txtに書き出します。BIOS、NAND、鍵、コンテンツ本体は出力しません。
setting.effects.help=テーマに付属する移動、決定、戻るの効果音を使います。
setting.effects_volume.help=操作効果音の音量です。背景音楽とは別に調整できます。
setting.environment.help=検出したDS/DSi動作モードです。この値だけでは起動環境やシステムタイトルの対応状況は分かりません。
setting.extensions.help=表示するファイル名の末尾だけを隠します。実際のパス、関連付け、セーブは変更しません。
setting.filter.help=全ファイル、または対応ゲーム、関連付け済みメディアや文書を表示します。カバー画像は一覧に出しません。
setting.hidden.help=ドットで始まる項目やFATの隠し属性を表示します。移動用のドット項目は表示しません。
setting.hide_bios.help=biosという名前のフォルダーを一覧や選択画面で隠します。初期値はオンです。BIOS本体は残り、エミュレーターから利用できます。
setting.hide_saves.help=savesとsavestatesフォルダーを一覧や選択画面で隠します。初期値はオンです。セーブ本体や保存動作は変更しません。
setting.icon_labels.help=このタブの下画面アイコンに名前や詳細を表示します。リスト表示では名前を残します。上画面の情報は常に表示します。
setting.icons.help=このタブのアイコンを小、中、大から選びます。リストでは隠しつつ大きさを記憶します。他のタブは変わりません。
setting.interface_language.help=SD上の言語ファイルを選びます。カスタムはlanguage.iniを使い、英語は無視します。不足する翻訳や復旧時は英語になります。
setting.launch.help=DSiのSDからの直接起動とargvに対応します。Gloamへの復帰には対応アプリが必要です。起動ガイドを参照してください。
setting.loaders.help=nds-bootstrapの既定設定、セーブ枠、ゲーム内メニューのキーです。DSi実機で起動、セーブ、復帰を確認済みですが、対応はタイトルごとに異なります。
setting.motion.help=選択を即座に切り替え、画面の動きを控えめにします。
setting.music_mode.help=オフ、テーマ音楽、または個人のWAVを選びます。復旧モードでは再生しません。
setting.music_path.help=8-48kHz、1MiB以下のモノラルPCM16 WAVを選びます。別アプリを使わず繰り返し再生します。
setting.music_volume.help=背景音楽の音量です。効果音とは別に調整でき、ゼロで消音します。
setting.preset_load.help=選んだ外観設定を適用します。移動位置、ゲーム設定、関連付け、セーブは変更しません。
setting.preset_save.help=現在の外観を選んだ枠に保存します。前の設定はバックアップとして残します。
setting.preset_slot.help=Everyday、Evening、Travelから選びます。各枠にテーマ、壁紙、アイコン、表示方法などを保存できます。
setting.profiles.help=INIプロファイルでアイコンや起動アプリを指定します。拡張子ごとの個人設定も編集できます。
setting.refresh.help=テーマ、関連付け、現在のフォルダーを再読み込みし、画像キャッシュを消去します。選択項目がまだ表示可能なら維持します。
setting.reset_appearance.help=標準の外観に戻します。テーマや元画像はSDに残ります。
setting.reset_browser.help=並び順、表示対象、拡張子、タイトル言語、スクロール速度を初期値に戻します。ライブラリ、タブ、お気に入り、外観は残ります。
setting.reset_configuration.help=設定や関連付けを初期値に戻します。もう一度Aで確定します。以前の設定は保管し、アプリ、セーブ、テーマ、画像は残します。
setting.reset_wallpapers.help=個人の壁紙設定を消してテーマの背景に戻します。画像やテーマのファイルは削除しません。
setting.route_camera.help=インストール済みのカメラと起動経路を確認します。動作は起動環境に依存します。Aで再検出します。
setting.route_direct.help=DSiのSDから直接起動します。argvと復帰への対応はアプリ次第です。Aで起動経路を再確認します。
setting.route_download.help=DSダウンロードプレイと起動経路を検出します。無線転送には対応する相手と別途テストが必要です。Aで再検出します。
setting.route_homebrew.help=指定プロファイル用の/_nds/nds-bootstrap-hb-release.ndsを確認します。多くの自作ソフトは直接起動します。Aで再確認します。
setting.route_menu.help=DSiメニューと、存在する場合はnand:/launcher.dsiを確認します。NANDの起動設定は変更しません。Aで再検出します。
setting.route_picto.help=ピクトチャットと起動経路を検出します。ローカル無線には対応ファームウェアと相手が必要です。Aで再検出します。
setting.route_retail.help=/_nds/nds-bootstrap-release.ndsを確認します。存在するだけでは全ゲームの対応を保証しません。Aで再確認します。
setting.route_settings.help=本体設定を検出しDSiメニュー経由で起動します。言語パッチ版では起動後にもう一度ボタン操作が必要な場合があります。Aで再検出します。
setting.route_slot1.help=対応する補助プログラムのパスと実行ファイルを確認します。カートリッジが必要です。Aで再確認します。
setting.route_sound.help=サウンドと起動経路を検出します。再生と録音の動作は起動環境に依存します。Aで再検出します。
setting.save.help=現在の設定を保存します。失敗した場合は未保存のままエラーを表示します。
setting.sleep.help=ふたを閉じると自動でスリープします。DSi実機で復帰後の画面、操作、テーマ音楽を確認済みです。他の環境でも確認が必要です。
setting.sort.help=フォルダーを先に表示し、ファイルを名前、拡張子、更新日で並べます。選択はパスを追跡します。
setting.speed.help=方向キーやL/Rを押し続けたときの繰り返し速度を変えます。単独の入力はすぐ反応します。
setting.splash_mode.help=オフ、テーマ、カスタムから選びます。テーマに起動画面がなければ付属の既定画面を使います。復旧時は省略します。
setting.splash_once.help=読み込み中は再生終了を待ちません。一度再生は終了後に一覧を開きます。ボタンを押すと省略できます。
setting.splash_path.help=SD内の変換済み.gspを選びます。カスタムが有効になり、テーマ自体は変更しません。
setting.splash_preview.help=選択中の起動画面を再生します。ボタンを押すと戻ります。プレビューで設定は変更しません。
setting.splash_sound.help=起動画面に含まれる音を効果音の音量で再生します。テーマ音楽の前に停止し、動きを減らす設定では無音になります。
setting.startup.help=次回起動時に最後のタブか指定タブを開きます。タイトルを自動起動する設定ではありません。
setting.system.help=システムタブを開きます。各起動経路の利用可否は個別に表示します。
setting.system_files.help=FATでシステム属性のあるファイルを表示します。編集や削除を可能にする機能ではありません。
setting.system_menu.help=インストール済みのDSiメニューへ戻ります。有効な言語パッチ版を優先します。パッチ適用本体では確認メッセージに従ってください。
setting.tabs.help=_nds/dsi-frontend/tabs.iniでルートや追加タブを編集し、再起動してください。IDで移動位置を保持します。
setting.theme.help=項目を選びXでプレビューを読み込みます。準備後Aで適用し、Bで中止します。復旧時は内蔵表示を使います。
setting.title_source.help=ファイル名か必要時に読み込む内部DSタイトルを表示します。並べ替えや起動には実際のファイル名を使います。
setting.toolchain.help=このビルドで使ったSDKの版です。詳細はdocs/development/TOOLCHAIN.mdを参照してください。
setting.top_background.help=SD内のPNG/JPEGを選びます。個人の壁紙はテーマを変えても維持し、元画像は変更しません。
setting.top_content.help=テーマはテーマ指定の表示、近隣は前後のカバーを表示します。Smartは閲覧内容に合わせます。Yで項目の詳細を開きます。
setting.unlaunch.help=用意したインストーラーを開き、安全表示、メニュー音、起動方法を設定します。インストーラーの設定はGloamの設定とは別です。
setting.view.help=インデックスは左右でフォルダーや文字へ移動し、シェルフはカバー表示です。通常、詳細、リスト、グリッドも選べます。タブごとに保存します。
setting.wall_strength.help=テーマの既定値、オフ、または5-35%の画像濃度を選びます。背景を控えめにすると文字が読みやすくなります。
