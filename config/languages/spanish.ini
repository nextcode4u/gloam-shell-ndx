setting.about.help=Frontend basado en BlocksDS con homebrew, audio y temas propios. La compatibilidad de carga depende del título y del entorno.
setting.accent.help=Elige un color de acento personal sin modificar el paquete del tema instalado.
setting.audio.help=Si falta el audio opcional o su formato no es compatible, la navegación continúa sin sonido.
setting.auto_launch.help=Desactivado por defecto. Al iniciar, abre el último título tras una cuenta atrás. Cualquier entrada cancela; SELECT al arrancar lo omite. Prueba primero el título manualmente.
setting.battery.help=Nivel de batería comunicado por la consola (0-15) y estado del cargador. No es un porcentaje calculado.
setting.bottom_background.help=Elige una imagen para la pantalla táctil. Los controles y sus zonas táctiles conservan su posición.
setting.brightness.help=Ajusta el brillo de 1 a 5. En DSi se guarda como ajuste de la consola, independiente de los colores del tema.
setting.cheats.help=Lee los trucos de usrcheat.dat para la revisión del título elegido. La selección se guarda aparte; el efecto depende del juego y del backend.
setting.clear_caches.help=Borra iconos preparados y miniaturas temporales de RAM y SD. Conserva imágenes originales, asignaciones y partidas.
setting.clear_recent.help=Borra el historial de solicitudes de inicio de Gloam. Conserva favoritos, contenido y partidas.
setting.clock.help=Elige 12 o 24 horas para la pantalla de Gloam. No cambia el reloj de la consola.
setting.config_export.help=Guarda ajustes, pestañas, favoritos, historial y opciones en configuration/export.dsconfig. No incluye aplicaciones, imágenes ni partidas.
setting.config_import.help=Revisa un archivo .dsconfig y confirma su importación. Los ajustes actuales se respaldan. Al terminar se recargan los ajustes. No disponible en recuperación.
setting.covers.help=Muestra la portada del elemento seleccionado arriba. Al desactivarlo se muestra información y se evita decodificar la portada.
setting.dashboard.help=Muestra, oculta y ordena secciones de Inicio. L/R cambia la cantidad de elementos en el editor. Ajustes sigue accesible.
setting.diagnostics.help=Escribe el estado de ejecución y compilación en _nds/dsi-frontend/diagnostics.txt. No exporta BIOS, NAND, claves ni contenido.
setting.effects.help=Usa los sonidos de selección, confirmación y regreso del tema activo, si los incluye.
setting.effects_volume.help=Volumen de los efectos de interfaz, independiente de la música de fondo.
setting.environment.help=Modo DS/DSi detectado. Por sí solo no identifica el cargador ni confirma la carga de aplicaciones del sistema.
setting.extensions.help=Oculta solo la extensión mostrada. No cambia rutas, asociaciones ni partidas.
setting.filter.help=Muestra todos los archivos o solo los tipos reconocidos. Las portadas siguen ocultas como recursos.
setting.hidden.help=Muestra archivos con punto inicial y entradas ocultas de FAT. Las entradas de navegación punto y doble punto se excluyen siempre.
setting.hide_bios.help=Oculta carpetas llamadas bios, sin distinguir mayúsculas. Activado por defecto. Los emuladores conservan acceso; no se mueve ni borra nada.
setting.hide_saves.help=Oculta carpetas saves o savestates, sin distinguir mayúsculas. Activado por defecto. Las partidas se conservan y los juegos pueden seguir guardando.
setting.icons.help=Iconos pequeños o grandes. Lista los oculta y recuerda el tamaño anterior. Se aplica a Inicio, Sistema y pestañas de carpetas.
setting.launch.help=Carga directa desde SD de DSi con argv. Volver a Gloam requiere una aplicación compatible; consulta la guía de carga.
setting.loaders.help=Opciones predeterminadas de nds-bootstrap, ranuras de guardado y teclas de menú. DSiWare y Slot-1 usan rutas distintas; la compatibilidad depende del título.
setting.motion.help=Usa cambios de selección inmediatos y movimientos de panel más sencillos.
setting.music_mode.help=Sin música, pista del tema o WAV personal. La reproducción se desactiva en recuperación.
setting.music_path.help=Elige un WAV mono PCM16 de 8-48 kHz y hasta 1 MiB. La pista se repite dentro de Gloam.
setting.music_volume.help=Volumen de música independiente de los efectos del tema. Cero silencia la reproducción.
setting.preset_load.help=Aplica el perfil elegido. Conserva navegación, opciones de juegos, asociaciones y partidas.
setting.preset_save.help=Guarda la apariencia en el perfil elegido. Conserva la versión anterior como respaldo.
setting.preset_slot.help=Elige Everyday, Evening o Travel. Cada perfil guarda tema, fondos, vista, iconos y opciones de lectura.
setting.profiles.help=Los perfiles INI eligen iconos y aplicaciones homebrew. Aquí puedes editar las asociaciones personales de extensiones.
setting.refresh.help=Recarga temas, asociaciones y esta carpeta; descarta miniaturas preparadas. Conserva la selección si sigue visible.
setting.reset_appearance.help=Restaura la apariencia integrada. Los paquetes de temas y las imágenes originales siguen en SD.
setting.reset_browser.help=Restaura orden, visibilidad, extensiones, idioma de títulos y desplazamiento. Conserva bibliotecas, pestañas, favoritos y apariencia.
setting.reset_configuration.help=Restaura ajustes, pestañas, favoritos y opciones de títulos. A otra vez confirma. Archiva los ajustes anteriores y conserva aplicaciones, partidas, cargadores, temas e imágenes.
setting.reset_wallpapers.help=Quita los fondos personales y restaura los del tema. No borra imágenes ni archivos del tema.
setting.route_camera.help=Detecta Cámara en NAND sin escribir. La ruta depende del entorno de arranque. A actualiza la detección.
setting.route_direct.help=Carga directa desde SD de DSi. Cada aplicación debe admitir argv y regreso al cargador. A actualiza las comprobaciones.
setting.route_download.help=Detecta Descarga DS en NAND sin escribir. La transferencia inalámbrica y la ruta con Unlaunch necesitan validación. A actualiza la detección.
setting.route_homebrew.help=Comprueba /_nds/nds-bootstrap-hb-release.nds para perfiles que lo solicitan. El resto puede usar carga directa. A actualiza.
setting.route_menu.help=Solicita volver al menú. Unlaunch puede abrir su destino configurado. Gloam no modifica los ajustes de arranque en NAND.
setting.route_picto.help=Detecta PictoChat y comprueba su ruta nativa. La comunicación requiere firmware y otras consolas compatibles. A actualiza.
setting.route_retail.help=Comprueba /_nds/nds-bootstrap-release.nds. Su presencia no confirma compatibilidad con todos los juegos. A actualiza.
setting.route_settings.help=Detecta Ajustes de la consola en NAND sin escribir. Encontrarlo no confirma la ruta con Unlaunch. A actualiza.
setting.route_slot1.help=Comprueba las rutas del auxiliar y valida su ejecutable. También necesitas una tarjeta insertada. A actualiza.
setting.route_sound.help=Detecta Sonido de DSi y comprueba su ruta nativa. Reproducción y grabación dependen del entorno de arranque. A actualiza.
setting.save.help=Guarda los ajustes de Gloam ahora. Si falla, siguen pendientes y se muestra un error.
setting.settings_mode.help=Simple muestra controles cotidianos. Avanzado añade opciones de carga, arranque y mantenimiento. Cambiar de modo conserva los ajustes existentes.
setting.sleep.help=El SDK gestiona la espera al cerrar la tapa. Suspender y reanudar necesita pruebas en una consola real.
setting.sort.help=Las carpetas van primero. Ordena archivos por nombre, extensión o fecha. La selección sigue su ruta.
setting.speed.help=Cambia la repetición al mantener botones y L/R. Las pulsaciones individuales siguen siendo inmediatas.
setting.startup.help=Elige la última pestaña o una pestaña configurada. Se aplica al próximo inicio y no abre ningún título.
setting.system.help=Abre la pestaña Sistema. Cada ruta nativa indica su disponibilidad por separado.
setting.system_files.help=Muestra archivos marcados como Sistema en FAT. No permite editarlos ni borrarlos.
setting.system_menu.help=Solicita el menú de DSi. Con Unlaunch puede abrirse su destino de arranque configurado; esa ruta sigue siendo experimental.
setting.tabs.help=Edita _nds/dsi-frontend/tabs.ini para cambiar raíces y pestañas. Reinicia después. Los identificadores conservan la navegación guardada.
setting.theme.help=Previsualiza un paquete y su fuente. A aplica; B cancela. La recuperación usa recursos integrados.
setting.title_language.help=Elige el idioma del título interno, con inglés y japonés como alternativas. No cambia el idioma del juego ni de la interfaz. Los caracteres no compatibles usan un sustituto.
setting.title_source.help=Usa nombres de archivo o títulos internos de DS cargados al seleccionarlos. El orden y la carga siguen usando el nombre de archivo real.
setting.toolchain.help=Versión del SDK usada en esta compilación. Consulta docs/development/TOOLCHAIN.md para detalles del paquete y compatibilidad SD.
setting.top_background.help=Elige un PNG/JPEG en SD. Los fondos personales se conservan al cambiar de tema; las imágenes originales no se mueven.
setting.unlaunch.help=Abre el instalador que hayas proporcionado para ajustar arranque, aviso de seguridad y sonido del menú. Sus cambios son independientes de Gloam.
setting.view.help=Índice: izquierda/derecha salta entre carpetas y letras. Estante: portadas. Clásica: filas. Detallada: información. Lista: sin iconos. Cuadrícula: mosaico. Se aplica a todas las pestañas.
setting.wall_strength.help=Intensidad del tema, desactivada o del 5 al 35 por ciento. Los fondos suaves facilitan leer el texto.

