setting.about.label=Build information
setting.about.help=BlocksDS frontend. Direct homebrew, bounded audio and native theme packs are implemented. Retail handoff is experimental.
setting.accent.label=Accent
setting.accent.help=Choose a personal accent override. The installed theme package is left unchanged.
setting.audio.label=Playback status
setting.audio.help=Missing or unsupported optional audio falls back to silence; browsing stays available.
setting.auto_launch.label=Auto-launch recent
setting.auto_launch.help=Off by default. At next normal boot, launch the most recent request after a countdown. Any input cancels; early SELECT recovery bypasses it. Test the title manually first.
setting.battery.label=Battery
setting.battery.help=Raw hardware battery level (0-15) and charger state. This is not a calculated percentage.
setting.bottom_background.label=Bottom wallpaper
setting.bottom_background.help=Choose a separate image for the touch screen. Required controls and touch targets keep their positions.
setting.brightness.label=Brightness
setting.brightness.help=Set the console backlight from 1 to 5. On DSi this is a persistent console setting, separate from theme colors.
setting.cheats.label=Title cheats
setting.cheats.help=Read revision-matched usrcheat.dat entries for the selected title. Selection is separate from the database. Actual in-game effect still needs validation.
setting.clear_caches.label=Clear caches
setting.clear_caches.help=Discard prepared icons, RAM artwork and disposable disk thumbnails. Source images, assignments and game saves remain on SD.
setting.clear_recent.label=Clear recent list
setting.clear_recent.help=Clear frontend launch-request history. Favorites, content and saves remain on SD.
setting.clock.label=Clock format
setting.clock.help=Choose 12 or 24 hours. This affects the launcher display, not the console clock.
setting.config_export.label=Export configuration
setting.config_export.help=Save frontend settings, tabs, pins, history and item/game/association records in configuration/export.dsconfig. Apps, artwork and saves are not included.
setting.config_import.label=Import configuration
setting.config_import.help=Inspect a .dsconfig archive, then confirm import. Current records are backed up and settings reload after successful import. Available outside recovery.
setting.covers.label=Cover preview
setting.covers.help=Show selected-item artwork on top. Off uses item information and avoids cover decoding.
setting.dashboard.label=Dashboard
setting.dashboard.help=Show, hide, reorder and limit Home sections. L/R adjusts item counts in the editor. Settings always remains accessible.
setting.diagnostics.label=Export diagnostics
setting.diagnostics.help=Write observed runtime and build state to _nds/dsi-frontend/diagnostics.txt. No BIOS, NAND, keys or content files are exported.
setting.effects.label=Theme sounds
setting.effects.help=Use the active theme's cursor, confirm and back sounds when supplied.
setting.effects_volume.label=Sound volume
setting.effects_volume.help=Theme UI sound level, independent of background music.
setting.environment.label=Execution mode
setting.environment.help=Detected DS/DSi execution mode. This alone does not identify the bootloader or prove system-title launch support.
setting.extensions.label=Show extensions
setting.extensions.help=Hide only the displayed filename suffix. Actual paths, associations and saves are unchanged.
setting.filter.label=File filter
setting.filter.help=All files, or recognized native, associated and media/document types. Covers remain hidden as assets.
setting.hidden.label=Show hidden
setting.hidden.help=Show dot-hidden files and FAT hidden entries. Navigation dot entries are always excluded.
setting.hide_bios.label=Hide BIOS folders
setting.hide_bios.help=Hide folders named bios, ignoring case, in browsers and file pickers. On by default. Emulators can still read their BIOS files; nothing is moved or deleted.
setting.hide_saves.label=Hide save folders
setting.hide_saves.help=Hide folders named saves or savestates, ignoring case, in browsers and file pickers. On by default. Save files remain untouched and game saving still works.
setting.icons.label=Icon size
setting.icons.help=Small or native-size banners. Icons are hidden in List view; the previous size is remembered. Applies to Home, System and folder tabs.
setting.launch.label=Homebrew launch
setting.launch.help=Direct DSi-SD homebrew and nonempty argv are supported. Return needs a compatible application; see launch documentation.
setting.loaders.label=Game defaults
setting.loaders.help=Default nds-bootstrap options, save slots and in-game menu keys. Handoff remains experimental; DSiWare and Slot-1 use separate routes.
setting.motion.label=Reduced motion
setting.motion.help=Use immediate selection changes and simpler panel movement.
setting.music_mode.label=Background music
setting.music_mode.help=Off, the active theme's track, or your custom WAV. Playback stays off in recovery.
setting.music_path.label=Choose music
setting.music_path.help=Select mono PCM16 WAV at 8-48 kHz, up to 1 MiB. The chosen track loops without another application.
setting.music_volume.label=Music volume
setting.music_volume.help=Launcher music level, independent of theme effects. Zero mutes playback.
setting.preset_load.label=Load appearance
setting.preset_load.help=Apply the selected preset. Navigation, game options, associations and saves stay in place.
setting.preset_save.label=Save appearance
setting.preset_save.help=Save current appearance into the selected preset. Its previous revision remains as a backup.
setting.preset_slot.label=Preset slot
setting.preset_slot.help=Choose Everyday, Evening or Travel. Each stores your theme, wallpapers, icon/view style and readability choices.
setting.profiles.label=Emulator profiles
setting.profiles.help=INI profiles select icons and direct homebrew applications. Personal extension defaults can be edited here.
setting.refresh.label=Refresh metadata
setting.refresh.help=Reload themes, associations and this folder; discard prepared artwork thumbnails. Keep the selected path when it remains visible.
setting.reset_appearance.label=Reset appearance
setting.reset_appearance.help=Restore built-in appearance choices. Theme packages and source images remain on SD.
setting.reset_browser.label=Reset browser options
setting.reset_browser.help=Restore sorting, visibility, extension labels, title language and scroll defaults. Libraries, folder tabs, favorites and appearance stay in place.
setting.reset_configuration.label=Reset configuration
setting.reset_configuration.help=Restore all frontend settings, tabs, favorites and game/item overrides. A again confirms. Previous settings are archived; apps, saves, loaders, themes and artwork are kept.
setting.reset_wallpapers.label=Reset wallpapers
setting.reset_wallpapers.help=Clear personal wallpaper choices and restore the active theme's backgrounds. No images or theme files are deleted.
setting.route_camera.label=Camera
setting.route_camera.help=Read-only NAND discovery. Stock-boot controls work; Unlaunch routes still need validation. A refreshes discovery.
setting.route_direct.label=Direct homebrew
setting.route_direct.help=DSi SD direct loading. Each app must support argv and loader return. Press A to refresh installed-route checks.
setting.route_download.label=Download Play
setting.route_download.help=Read-only NAND discovery. Stock-boot app startup works; wireless transfer and Unlaunch routing are unverified. A refreshes discovery.
setting.route_homebrew.label=Homebrew backend
setting.route_homebrew.help=Checks /_nds/nds-bootstrap-hb-release.nds for profiles that request it. Most homebrew uses direct loading. Press A to refresh.
setting.route_menu.label=System Menu
setting.route_menu.help=Stock-boot return works in the test setup. Unlaunch may select its configured boot target instead. This frontend does not change NAND boot settings.
setting.route_picto.label=PictoChat
setting.route_picto.help=Discover PictoChat and check its native route. Local wireless needs compatible firmware and peers. A refreshes discovery.
setting.route_retail.label=Retail backend
setting.route_retail.help=Checks /_nds/nds-bootstrap-release.nds. Present means installed, not verified game compatibility. Press A to refresh.
setting.route_settings.label=System Settings
setting.route_settings.help=Read-only NAND discovery checks this console's installed title. A found title does not prove Unlaunch routing. A refreshes discovery.
setting.route_slot1.label=Slot-1 helper
setting.route_slot1.help=Checks supported helper paths and validates the selected homebrew binary. A cartridge is still required. Press A to refresh.
setting.route_sound.label=Sound
setting.route_sound.help=Discover installed Sound and check its native route. Playback and recording depend on the boot environment. A refreshes discovery.
setting.save.label=Save preferences
setting.save.help=Write frontend settings now. Failed writes remain unsaved and report an error.
setting.settings_mode.label=Settings mode
setting.settings_mode.help=Simple keeps everyday controls. Advanced adds launch, boot and maintenance settings. Switching views preserves your existing choices.
setting.sleep.label=Lid sleep
setting.sleep.help=The SDK's automatic lid sleep service is enabled. Sleep/wake behavior still requires real-console testing.
setting.sort.label=Sort order
setting.sort.help=Folders stay first. Sort files by name, extension or modification date. Selection follows its path.
setting.speed.label=Scroll speed
setting.speed.help=Change held-button repeat speed for browsing and L/R tabs. Single presses remain immediate.
setting.startup.label=Start in
setting.startup.help=Choose Last tab or a configured tab. This applies at the next startup; it does not launch a title.
setting.system.label=System applications
setting.system.help=Open the System tab. Its native launch routes still report their availability separately.
setting.system_files.label=Show system files
setting.system_files.help=Show files marked System by FAT. This does not enable editing or deleting system files.
setting.system_menu.label=Return to DSi Menu
setting.system_menu.help=Stock-boot Menu return is tested in melonDS. Under Unlaunch, the configured boot target may open instead. Explicit Unlaunch routing remains experimental.
setting.tabs.label=Folder tabs
setting.tabs.help=Edit _nds/dsi-frontend/tabs.ini for library roots and custom tabs. Restart after editing. IDs preserve saved navigation.
setting.theme.label=Theme
setting.theme.help=Preview a package and its supported bitmap font. A applies, B cancels. Recovery uses built-in assets.
setting.title_language.label=Title language
setting.title_language.help=Choose the internal banner language, with English then Japanese fallback. This does not change the game or translate the UI. Current fonts support ASCII and Latin-1.
setting.title_source.label=Title names
setting.title_source.help=Use filenames or lazily loaded internal DS banner titles. Sorting and launch paths still use the actual filename.
setting.toolchain.label=Toolchain
setting.toolchain.help=SDK version used for this build. Package details and the SD compatibility override are documented in docs/development/TOOLCHAIN.md.
setting.top_background.label=Top wallpaper
setting.top_background.help=Choose a PNG/JPEG anywhere on SD. Personal wallpapers survive theme changes; source images stay in place.
setting.unlaunch.label=Unlaunch setup
setting.unlaunch.help=Open your supplied installer to manage health-and-safety, Menu sound and boot setup. Applying installer choices is separate from frontend preferences.
setting.view.label=Browser view
setting.view.help=Index: left/right jumps folders and letters. Shelf: centered covers. Classic: rows. Extended: details. List: no icons. Grid: tiles. Applies to all tabs.
setting.wall_strength.label=Wallpaper strength
setting.wall_strength.help=Theme default, Off, or 5-35 percent image strength. Muted backgrounds keep foreground text readable.
