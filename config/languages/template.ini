dialog.game_mode.help=Auto lets the backend decide DS or DSi mode. A DSi-enhanced title and compatible environment are required for DSi features.
dialog.game_cpu.help=CPU boost requests the DSi's faster CPU through nds-bootstrap. It does not alter direct emulator launches.
dialog.game_vram.help=VRAM boost is a backend option. Auto keeps backend defaults; some games require it disabled.
dialog.game_dma.help=Card DMA controls backend ROM reads. Disable it when diagnosing loading compatibility.
dialog.game_async.help=Asynchronous reads are backend-specific. Auto uses its defaults; disabling may help compatibility.
dialog.game_language.help=Override the language passed to the game. Auto uses the console/backend language.
dialog.game_slot.help=Slot 0 reuses recognized saves. Slots 1-9 use independent .savN files, or .pubN/.prvN for DSiWare. Existing saves are not replaced.
dialog.game_size.help=Auto uses the DS save database or DSiWare public/private header sizes. Unknown DS games need an explicit size. Existing saves are never resized.
dialog.game_hotkey.help=Opens nds-bootstrap's in-game menu. Return depends on backend/game compatibility; QUIT_PATH points to BOOT.NDS.
