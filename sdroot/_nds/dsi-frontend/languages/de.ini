setting.interface_language.help=Sprachdatei auf SD wählen. Custom nutzt language.ini; English umgeht sie. Fehlende Texte und der Wiederherstellungsmodus nutzen Englisch.
setting.icon_labels.help=Namen neben Symbolen unten anzeigen. Die Listenansicht behält ihre Namen. Obere Elementinformationen bleiben sichtbar. Für diesen Tab separat gespeichert.
setting.icons.help=Kleine, mittlere oder große Symbole wählen. Die Listenansicht blendet Symbole aus. Cover bleiben unverändert. Für diesen Tab separat gespeichert.
setting.motion.help=Theme-Bewegung reduzieren und animierte Symbole anhalten. Die Navigation bleibt verfügbar.
setting.music_mode.help=Musik ausschalten, Theme-Titel oder eigene WAV abspielen. Im Wiederherstellungsmodus bleibt Musik aus.
setting.music_volume.help=Musiklautstärke, unabhängig von Theme-Effekten. Null schaltet Musik stumm.
setting.effects.help=Die Theme-Klänge für Auswahl, Bestätigung und Zurück nutzen, wenn vorhanden.
setting.effects_volume.help=Lautstärke der Bedienklänge, unabhängig von der Hintergrundmusik.
setting.covers.help=Cover des gewählten Elements oben anzeigen. Aus zeigt Informationen und vermeidet das Decodieren von Covern.
setting.hidden.help=Versteckte Namen und FAT-Einträge anzeigen. Die Navigationseinträge . und .. bleiben ausgeschlossen.
setting.hide_saves.help=Speicherordner im Browser ausblenden. Dateien werden weder gelöscht noch verschoben.
setting.hide_bios.help=BIOS-Ordner im Browser ausblenden. Emulatoren können die Dateien weiterhin lesen.
setting.extensions.help=Nur die angezeigte Dateiendung ausblenden. Pfade, Zuordnungen und Speicherdateien bleiben unverändert.
setting.background_updates.help=Veröffentlichte Versionen nach dem Start per gespeichertem WLAN prüfen. Einmal täglich, ohne automatische Downloads. Ausschalten bricht die Prüfung ab.
setting.check_updates.help=Prüfung bei Leerlauf vormerken. Ein Pfeil zeigt eine neuere Version. Update per PC-Setup oder GitHub Releases; Einstellungen und Speicherdateien bleiben erhalten.
setting.splash_mode.help=Intro aus, Theme-Intro oder eigenes Paket wählen. Das Theme kann auf das Standardintro zurückfallen. Wiederherstellung überspringt Intros.
setting.splash_path.help=Vorbereitetes .gsp-Paket auf SD wählen. Aktiviert Custom, ohne das Theme zu ändern.
setting.splash_once.help=Beim Laden wartet nicht auf das Animationsende. Einmal abspielen beendet das Intro vor dem Browser. Beliebige Taste überspringt es.
setting.splash_sound.help=Optionalen Intro-Ton mit Effektlautstärke spielen. Er endet vor der Theme-Musik. Weniger Bewegung bleibt stumm.
setting.splash_preview.help=Gewähltes Intro jetzt abspielen. Beliebige Taste kehrt zurück. Die Vorschau ändert keine Einstellungen.
setting.save.help=Einstellungen jetzt speichern. Bei einem Fehler bleiben Änderungen ungespeichert und eine Fehlermeldung erscheint.
setting.accent.help=Eigenen Akzent wählen. Das installierte Theme bleibt unverändert.
setting.clock.help=12- oder 24-Stunden-Anzeige wählen. Ändert Gloams Anzeige, nicht die Konsolenuhr.
setting.view.help=Ansicht wählen. Liste blendet Symbole aus; Raster, Regal und Index zeigen dieselben Dateien auf andere Weise. Für diesen Tab separat gespeichert.
setting.theme.help=Theme wählen und mit X die Vorschau laden. Danach übernimmt A das Theme; B bricht ab. Die Wiederherstellung nutzt integrierte Bilder.
dialog.game_slot.help=Platz 0 nutzt erkannte Speicherdateien. 1-9 nutzen getrennte .savN-Dateien, bei DSiWare .pubN/.prvN. Vorhandene Speicherdateien werden nicht ersetzt.
dialog.why_handler=Warum diese Anwendung?
dialog.search_library=Bibliothek durchsuchen
dialog.search_hint=B zurück  X Text  SEL Bereich

setting.top_content.label=Oberer Bildschirm

dialog.game_async.help=Asynchrone Lesezugriffe sind backendabhängig. Auto behält die Vorgabe bei. Bei Ladeproblemen testweise ausschalten.
dialog.game_cpu.help=CPU-Boost fordert den schnelleren DSi-Takt über nds-bootstrap an. Direkt gestartete Emulatoren bleiben unverändert.
dialog.game_dma.help=DMA steuert ROM-Lesezugriffe des Backends. Bei Ladeproblemen testweise ausschalten.
dialog.game_hotkey.help=Öffnet das nds-bootstrap-Spielmenü. Rückkehr hängt von Spiel und Backend ab; QUIT_PATH zeigt auf BOOT.NDS.
dialog.game_language.help=Sprache des Spiels, soweit unterstützt. Das ändert weder Gloams Sprache noch die Sprache des Spielmenüs.
dialog.game_manual.help=Die .txt-Anleitung liegt als Game.txt neben Game.nds. Fehlende oder leere Dateien löschen den alten Pfad. Aus löscht ihn; INI behalten lässt ihn unverändert.
dialog.game_mode.help=DS- oder DSi-Modus des Backends. Auto behält die Vorgabe bei. Die Auswahl fügt keine fehlende Hardwareunterstützung hinzu.
dialog.game_overlay_language.help=Sprache des nds-bootstrap-Spielmenüs, unabhängig vom Spiel. INI behalten übernimmt den gespeicherten Wert oder die Backend-Vorgabe.
dialog.game_screen_swap.help=Diese Kombination halten, um über nds-bootstrap die Bildschirme zu tauschen. INI behalten nutzt die gespeicherte Kombination oder L+R+Oben+X.
dialog.game_size.help=Auto verwendet bekannte DS-Speichergrößen oder die DSiWare-Headerwerte. Für unbekannte DS-Spiele die Größe angeben. Bestehende Dateien werden nie vergrößert oder verkleinert.
dialog.game_vram.help=VRAM-Boost ist eine Backend-Option. Auto behält die Vorgabe bei; manche Spiele benötigen die Einstellung Aus.
setting.about.help=BlocksDS-Frontend für Homebrew, Audio und Themes. DS-Spielstart, Speichern und Rückkehr wurden auf DSi getestet.
setting.audio.help=Fehlendes oder nicht unterstütztes Audio bleibt stumm. Der Dateibrowser funktioniert weiter.
setting.auto_launch.help=Beim nächsten Start öffnet ein Countdown den letzten Titel. Jede Eingabe bricht ab; SELECT-Wiederherstellung überspringt ihn. Standardmäßig aus. Titel vorher manuell testen.
setting.battery.help=Gemeldeter Akkustand (0-15) und Ladezustand. Das ist keine Prozentangabe.
setting.bottom_background.help=Eigenes Bild für den Touchscreen wählen. Bedienelemente und Touchflächen behalten ihre Position.
setting.brightness.help=Hintergrundbeleuchtung von 1 bis 5. Auf DSi wird dies als Konsoleneinstellung gespeichert, unabhängig vom Theme.
setting.cheats.help=Passende usrcheat.dat-Einträge für die Spielrevision auswählen. Die Datenbank bleibt unverändert. Wirkung hängt von Code und Titel ab; siehe Cheat-Anleitung.
setting.clear_caches.help=Vorbereitete Symbole, RAM-Bilder und temporäre Vorschaubilder verwerfen. Originalbilder, Zuordnungen und Spielstände bleiben erhalten.
setting.clear_recent.help=Liste der letzten Startanforderungen löschen. Favoriten, Inhalte und Spielstände bleiben erhalten.
setting.config_export.help=Frontend-Einstellungen und Zuordnungen in configuration/export.dsconfig sichern. Apps, Bilder und Spielstände sind nicht enthalten.
setting.config_import.help=Eine .dsconfig-Datei prüfen und Import bestätigen. Vorhandene Einstellungen werden gesichert. Im Wiederherstellungsmodus nicht verfügbar.
setting.dashboard.help=Home-Bereiche einblenden, ausblenden, ordnen und begrenzen. L/R ändert die Anzahl. Einstellungen bleiben immer erreichbar.
setting.diagnostics.help=Laufzeit- und Builddaten nach _nds/dsi-frontend/diagnostics.txt schreiben. BIOS, NAND, Schlüssel und Inhaltsdateien werden nicht exportiert.
setting.environment.help=Erkannter DS/DSi-Ausführungsmodus. Dieser allein verrät weder den Bootloader noch die Unterstützung für Systemtitel.
setting.filter.help=Alle Dateien oder bekannte Spiele, zugeordnete Medien und Dokumente anzeigen. Cover bleiben als Bilder ausgeblendet.
setting.launch.help=Direktes DSi-SD-Homebrew und argv werden unterstützt. Eine Rückkehr benötigt eine kompatible App; siehe Startanleitung.
setting.loaders.help=Vorgaben für nds-bootstrap, Speicherplätze und Spielmenü-Tasten. Start, Speichern und Rückkehr wurden auf DSi getestet; Unterstützung variiert je Titel.
setting.music_path.help=Mono-PCM16-WAV mit 8-48 kHz, höchstens 1 MiB wählen. Die Musik wird ohne weitere App wiederholt.
setting.preset_load.help=Gewähltes Erscheinungsbild laden. Navigation, Spieloptionen, Zuordnungen und Spielstände bleiben unverändert.
setting.preset_save.help=Aktuelles Erscheinungsbild im gewählten Platz sichern. Die vorherige Fassung bleibt als Sicherung erhalten.
setting.preset_slot.help=Everyday, Evening oder Travel wählen. Jeder Platz speichert Theme, Hintergründe, Symbolgröße, Ansicht und Lesbarkeit.
setting.profiles.help=INI-Profile legen Symbole und Homebrew-Apps fest. Persönliche Endungszuordnungen lassen sich hier bearbeiten.
setting.refresh.help=Themes, Zuordnungen und aktuellen Ordner neu laden; Bildcache verwerfen. Eine noch sichtbare Auswahl bleibt erhalten.
setting.reset_appearance.help=Integrierte Darstellung wiederherstellen. Theme-Pakete und Originalbilder bleiben auf SD.
setting.reset_browser.help=Sortierung, Sichtbarkeit, Endungen, Titelsprache und Scrolltempo zurücksetzen. Bibliotheken, Tabs, Favoriten und Aussehen bleiben erhalten.
setting.reset_configuration.help=Frontend-Einstellungen und Zuordnungen zurücksetzen. Mit A erneut bestätigen. Alte Einstellungen werden archiviert; Apps, Spielstände, Themes und Bilder bleiben erhalten.
setting.reset_wallpapers.help=Eigene Hintergründe zurücksetzen und Theme-Bilder verwenden. Keine Bild- oder Theme-Dateien werden gelöscht.
setting.route_camera.help=Installierte Kamera und ihren Startweg prüfen. Das Verhalten hängt von der Bootumgebung ab. A aktualisiert die Erkennung.
setting.route_direct.help=Direkter Start von DSi SD. argv und Rückkehr hängen von der App ab. A prüft die verfügbaren Startwege erneut.
setting.route_download.help=Installiertes Download-Spiel und seinen Startweg prüfen. Drahtlose Übertragung benötigt passende Partner und eigene Tests. A aktualisiert die Erkennung.
setting.route_homebrew.help=Prüft /_nds/nds-bootstrap-hb-release.nds für entsprechende Profile. Die meisten Apps starten direkt. A aktualisiert die Prüfung.
setting.route_menu.help=Installiertes DSi-Menü und optional nand:/launcher.dsi prüfen. NAND-Booteinstellungen werden nicht verändert. A aktualisiert die Erkennung.
setting.route_picto.help=PictoChat und seinen Startweg prüfen. Lokale Funkverbindungen benötigen passende Firmware und Partner. A aktualisiert die Erkennung.
setting.route_retail.help=Prüft /_nds/nds-bootstrap-release.nds. Vorhanden bedeutet installiert, nicht für jedes Spiel getestet. A aktualisiert die Prüfung.
setting.route_settings.help=Installierte Einstellungen über das DSi-Menü starten. Gepatchte Menüs können nach dem Start eine weitere Taste benötigen. A aktualisiert die Erkennung.
setting.route_slot1.help=Unterstützte Helferpfade und das gewählte Programm prüfen. Ein Modul ist weiterhin erforderlich. A aktualisiert die Prüfung.
setting.route_sound.help=Installierte Sound-App und ihren Startweg prüfen. Wiedergabe und Aufnahme hängen von der Bootumgebung ab. A aktualisiert die Erkennung.
setting.settings_mode.help=Einfach zeigt alltägliche Optionen. Erweitert ergänzt Start-, Boot- und Wartungsoptionen. Der Wechsel erhält alle Werte.
setting.sleep.help=Automatischer Deckel-Ruhezustand ist aktiv. Auf DSi wurden Aufwachen, Anzeige, Eingabe und Theme-Musik geprüft. Weitere Geräte müssen noch getestet werden.
setting.sort.help=Ordner zuerst, dann Dateien nach Name, Endung oder Änderungsdatum. Die Auswahl folgt ihrem Pfad.
setting.speed.help=Tempo bei gehaltenen Richtungstasten und L/R ändern. Einzelne Tastendrücke bleiben sofort wirksam.
setting.startup.help=Letzten oder festgelegten Tab beim nächsten Start öffnen. Es wird kein Titel automatisch gestartet.
setting.system.help=System-Tab öffnen. Die einzelnen Startwege zeigen ihre Verfügbarkeit separat an.
setting.system_files.help=Dateien mit dem FAT-Systemattribut anzeigen. Dadurch werden Bearbeiten und Löschen nicht freigeschaltet.
setting.system_menu.help=Über das installierte DSi-Menü zurückkehren. Ein geprüftes sprachgepatchtes Menü hat Vorrang. Auf gepatchten Konsolen den Hinweis beachten.
setting.tabs.help=Bibliothekswurzeln und eigene Tabs in _nds/dsi-frontend/tabs.ini bearbeiten. Danach neu starten. IDs erhalten gespeicherte Ordnerpositionen.
setting.title_language.help=Interne Bannersprache wählen. Ersatz ist Englisch, dann Japanisch. Spiel und UI bleiben unverändert; japanische Zeichen funktionieren unabhängig vom Theme.
setting.title_source.help=Dateinamen oder bei Bedarf geladene interne DS-Titel anzeigen. Sortierung und Start verwenden weiter den echten Dateinamen.
setting.toolchain.help=SDK-Version dieses Builds. Paketdetails stehen in docs/development/TOOLCHAIN.md.
setting.top_background.help=PNG/JPEG auf SD wählen. Persönliche Hintergründe bleiben beim Theme-Wechsel erhalten; Originaldateien bleiben unverändert.
setting.top_content.help=Theme folgt dem Design. Nachbarn zeigt nahe Cover. Smart passt sich dem Inhalt an. Y öffnet Details.
setting.unlaunch.help=Eigenen Installer für Startbildschirm, Menüton und Bootoptionen öffnen. Installer-Einstellungen sind von Gloam-Einstellungen getrennt.
setting.wall_strength.help=Theme-Vorgabe, Aus oder Bildstärke 5-35 Prozent. Gedämpfte Bilder halten Text lesbar.
