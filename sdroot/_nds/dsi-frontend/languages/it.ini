setting.interface_language.help=Scegli un catalogo su SD. Custom usa language.ini; English lo ignora. Le voci mancanti e il recupero usano l'inglese.
setting.icon_labels.help=Mostra i nomi accanto alle icone in basso. L'elenco mantiene i nomi. Le informazioni sullo schermo superiore restano visibili. Salvato separatamente per questa scheda.
setting.icons.help=Scegli icone piccole, medie o grandi. L'elenco nasconde le icone. Le copertine non cambiano. Salvato separatamente per questa scheda.
setting.motion.help=Riduce il movimento del tema e ferma le icone animate. La navigazione resta disponibile.
setting.music_mode.help=Disattiva la musica, usa quella del tema o un WAV personale. Il recupero resta silenzioso.
setting.music_volume.help=Volume musica, indipendente dagli effetti del tema. Zero disattiva la musica.
setting.effects.help=Usa i suoni del tema per spostamento, conferma e ritorno, se disponibili.
setting.effects_volume.help=Volume dei suoni dell'interfaccia, indipendente dalla musica di sottofondo.
setting.covers.help=Mostra in alto la copertina selezionata. No mostra le informazioni senza decodificare copertine.
setting.hidden.help=Mostra file nascosti per nome o attributo FAT. Le voci di navigazione . e .. restano escluse.
setting.hide_saves.help=Nasconde le cartelle dei salvataggi. Non elimina né sposta file.
setting.hide_bios.help=Nasconde le cartelle BIOS. Gli emulatori possono ancora leggere i file.
setting.extensions.help=Nasconde solo l'estensione visualizzata. Percorsi, associazioni e salvataggi non cambiano.
setting.background_updates.help=Controlla le versioni dopo l'avvio con il Wi-Fi salvato. Una volta al giorno, senza download automatici. Disattivare annulla il controllo.
setting.check_updates.help=Accoda un controllo quando inattivo. Una freccia indica una versione nuova. Aggiorna con lo strumento PC o GitHub Releases; impostazioni e salvataggi restano.
setting.splash_mode.help=Disattiva l'intro, usa quella del tema o un pacchetto personale. Il tema può usare l'intro predefinita. Il recupero salta le intro.
setting.splash_path.help=Scegli un pacchetto .gsp su SD. Attiva Custom senza modificare il tema.
setting.splash_once.help=Durante il caricamento non attende la fine dell'animazione. Una volta completa l'intro prima del browser. Qualsiasi tasto salta l'intro.
setting.splash_sound.help=Riproduce l'audio facoltativo dell'intro al volume effetti. Si ferma prima della musica. Movimento ridotto resta silenzioso.
setting.splash_preview.help=Riproduci l'intro ora. Qualsiasi tasto torna qui. L'anteprima non modifica le impostazioni.
setting.save.help=Salva le preferenze ora. Se fallisce, le modifiche restano non salvate e viene mostrato un errore.
setting.accent.help=Scegli un accento personale. Il tema installato resta invariato.
setting.clock.help=Scegli il formato a 12 o 24 ore. Cambia la visualizzazione di Gloam, non l'orologio della console.
setting.view.help=Scegli una vista. Elenco nasconde le icone; Griglia, Scaffale e Indice mostrano gli stessi file in modi diversi. Salvato separatamente per questa scheda.
setting.theme.help=Scegli un tema. X mostra l'anteprima, A applica, B annulla. Il recupero usa gli elementi integrati.
dialog.game_slot.help=Lo slot 0 usa i salvataggi riconosciuti. 1-9 usano file .savN separati, o .pubN/.prvN per DSiWare. I salvataggi esistenti non sono sostituiti.
