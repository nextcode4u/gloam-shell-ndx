setting.title_language.help=タイトル名を読む言語です。ゲームや画面表示の言語は変更しません。日本語の文字はすべてのテーマで表示できます。
setting.settings_mode.help=かんたん設定と詳細設定を切り替えます。ロックされている場合は詳細設定を開けません。
dialog.game_mode.help=自動では起動方式に任せます。DSi機能には対応タイトルと対応する起動環境が必要です。
dialog.game_cpu.help=nds-bootstrap経由でDSiの高速CPUを使います。エミュレーターの直接起動には影響しません。
dialog.game_vram.help=VRAMの拡張は起動方式の設定です。自動では標準値を使います。ゲームによっては無効にしてください。
dialog.game_dma.help=ゲームデータのDMA読み込みを設定します。起動の問題を調べる時は無効も試してください。
dialog.game_async.help=非同期読み込みは起動方式によって対応が異なります。自動では標準の設定を使います。
dialog.game_language.help=ゲームに渡す言語を選びます。自動では本体または起動方式の設定を使います。
dialog.game_slot.help=スロット0は既存のセーブを使います。1〜9は別のファイルです。DSiウェアは公開用と非公開用の保存領域を使います。
dialog.game_size.help=自動では保存データベースかDSiウェアのヘッダーを使います。既存のセーブのサイズは変更しません。
dialog.game_hotkey.help=nds-bootstrapのゲーム中メニューを開きます。戻る機能は対応状況によります。QUIT_PATHはBOOT.NDSを指します。

