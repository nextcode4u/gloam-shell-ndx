setting.interface_language.help=Kies een taalcatalogus op SD. Custom gebruikt language.ini; English slaat dit over. Ontbrekende teksten en herstel gebruiken Engels.
setting.icon_labels.help=Toon namen naast pictogrammen onderaan. De lijst behoudt namen. De informatie op het bovenste scherm blijft zichtbaar. Afzonderlijk opgeslagen voor dit tabblad.
setting.icons.help=Kies kleine, middelgrote of grote pictogrammen. De lijst verbergt pictogrammen. Hoezen blijven ongewijzigd. Afzonderlijk opgeslagen voor dit tabblad.
setting.motion.help=Verminder themabeweging en zet bewegende pictogrammen stil. Bladeren blijft beschikbaar.
setting.music_mode.help=Zet muziek uit, speel de themamuziek of een eigen WAV. In herstel blijft muziek uit.
setting.music_volume.help=Muziekvolume, los van thema-effecten. Nul dempt de muziek.
setting.effects.help=Gebruik de themageluiden voor selectie, bevestigen en terug, indien aanwezig.
setting.effects_volume.help=Volume van interfacegeluiden, los van de achtergrondmuziek.
setting.covers.help=Toon de hoes van het geselecteerde item bovenaan. Uit toont informatie zonder hoezen te decoderen.
setting.hidden.help=Toon verborgen namen en FAT-bestanden. De navigatie-items . en .. blijven uitgesloten.
setting.hide_saves.help=Verberg opslagmappen in de browser. Bestanden worden niet gewist of verplaatst.
setting.hide_bios.help=Verberg BIOS-mappen in de browser. Emulators kunnen de bestanden nog lezen.
setting.extensions.help=Verberg alleen de getoonde extensie. Paden, koppelingen en opslagbestanden blijven gelijk.
setting.background_updates.help=Controleer gepubliceerde versies na het opstarten via opgeslagen wifi. Eenmaal per dag, zonder automatisch downloaden. Uitschakelen annuleert de controle.
setting.check_updates.help=Plan een controle bij inactiviteit. Een pijl betekent een nieuwere versie. Werk bij via PC-setup of GitHub Releases; instellingen en saves blijven behouden.
setting.splash_mode.help=Kies geen intro, de thema-intro of een eigen pakket. Het thema kan de standaardintro gebruiken. Herstel slaat intro's over.
setting.splash_path.help=Kies een voorbereid .gsp-pakket op SD. Activeert Custom zonder het thema te wijzigen.
setting.splash_once.help=Tijdens laden wacht niet op het einde. Eenmaal afspelen voltooit de intro vóór de browser. Elke knop slaat deze over.
setting.splash_sound.help=Speel optioneel introgeluid op effectvolume. Het stopt vóór de themamuziek. Minder beweging blijft stil.
setting.splash_preview.help=Speel de gekozen intro nu. Elke knop keert terug. Het voorbeeld wijzigt geen instellingen.
setting.save.help=Sla instellingen nu op. Bij fouten blijven wijzigingen niet opgeslagen en verschijnt een melding.
setting.accent.help=Kies een eigen accentkleur. Het geïnstalleerde thema blijft ongewijzigd.
setting.clock.help=Kies 12- of 24-uursnotatie. Wijzigt de weergave in Gloam, niet de consoleklok.
setting.view.help=Kies een weergave. Lijst verbergt pictogrammen; Raster, Plank en Index tonen dezelfde bestanden op andere manieren. Afzonderlijk opgeslagen voor dit tabblad.
setting.theme.help=Kies een thema. X toont een voorbeeld, A past toe, B annuleert. Herstel gebruikt ingebouwde onderdelen.
dialog.game_slot.help=Vak 0 gebruikt herkende saves. 1-9 gebruiken aparte .savN-bestanden, of .pubN/.prvN voor DSiWare. Bestaande saves worden niet vervangen.
