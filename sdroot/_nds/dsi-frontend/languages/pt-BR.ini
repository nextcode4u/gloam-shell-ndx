setting.interface_language.help=Escolha um catálogo no SD. Custom usa language.ini; English o ignora. Traduções ausentes e a recuperação usam inglês.
setting.icon_labels.help=Mostra nomes junto aos ícones na tela inferior. A lista mantém os nomes. As informações da tela superior continuam visíveis. Salvo separadamente para esta aba.
setting.icons.help=Escolha ícones pequenos, médios ou grandes. A lista oculta os ícones. As capas não mudam. Salvo separadamente para esta aba.
setting.motion.help=Reduz o movimento do tema e pausa os ícones animados. A navegação continua disponível.
setting.music_mode.help=Desative a música, use a faixa do tema ou um WAV pessoal. A recuperação fica em silêncio.
setting.music_volume.help=Volume da música, separado dos efeitos do tema. Zero silencia a música.
setting.effects.help=Usa os sons do tema para mover, confirmar e voltar, quando disponíveis.
setting.effects_volume.help=Volume dos sons da interface, independente da música de fundo.
setting.covers.help=Mostra a capa selecionada na tela superior. Desligado mostra informações sem decodificar capas.
setting.hidden.help=Mostra arquivos ocultos por nome ou atributo FAT. As entradas de navegação . e .. ficam excluídas.
setting.hide_saves.help=Oculta pastas de saves na lista. Nenhum arquivo é apagado ou movido.
setting.hide_bios.help=Oculta pastas de BIOS na lista. Os emuladores ainda podem ler os arquivos.
setting.extensions.help=Oculta apenas a extensão exibida. Caminhos, associações e saves não mudam.
setting.background_updates.help=Verifica versões publicadas após iniciar, pelo Wi-Fi salvo. Uma vez ao dia, sem baixar automaticamente. Desativar cancela a verificação.
setting.check_updates.help=Agenda uma verificação quando ocioso. Uma seta indica versão nova. Atualize pelo programa de PC ou GitHub Releases; ajustes e saves ficam preservados.
setting.splash_mode.help=Desative a abertura, use a do tema ou um pacote pessoal. O tema pode usar a abertura padrão. A recuperação pula as aberturas.
setting.splash_path.help=Escolha um pacote .gsp no SD. Ativa Custom sem alterar o tema.
setting.splash_once.help=Durante o carregamento não espera a animação terminar. Uma vez conclui a abertura antes da lista. Qualquer botão pula a abertura.
setting.splash_sound.help=Reproduz o som opcional da abertura no volume dos efeitos. Para antes da música do tema. Movimento reduzido fica em silêncio.
setting.splash_preview.help=Reproduz a abertura agora. Qualquer botão retorna aqui. A prévia não altera ajustes.
setting.save.help=Salva os ajustes agora. Em caso de falha, as alterações continuam não salvas e um erro é exibido.
setting.accent.help=Escolha uma cor de destaque pessoal. O tema instalado não muda.
setting.clock.help=Escolha o formato de 12 ou 24 horas. Muda a exibição do Gloam, não o relógio do console.
setting.view.help=Escolha uma visualização. Lista oculta ícones; Grade, Estante e Índice mostram os mesmos arquivos de outras formas. Salvo separadamente para esta aba.
setting.theme.help=Escolha um tema e pressione X para carregar a prévia. Quando pronta, A aplica e B cancela. A recuperação usa recursos integrados.
dialog.game_slot.help=O espaço 0 usa saves reconhecidos. 1-9 usam arquivos .savN separados, ou .pubN/.prvN para DSiWare. Saves existentes não são substituídos.
dialog.why_handler=Por que este aplicativo?
dialog.search_library=Pesquisar biblioteca
dialog.search_hint=B voltar X editar SEL alcance

setting.top_content.label=Tela superior

dialog.game_async.help=Leituras assíncronas dependem do backend. Auto mantém o padrão. Desative para investigar problemas de carregamento.
dialog.game_cpu.help=O aumento de CPU solicita a velocidade DSi pelo nds-bootstrap. Não altera emuladores iniciados diretamente.
dialog.game_dma.help=O DMA controla a leitura de ROMs pelo backend. Desative para investigar problemas de carregamento.
dialog.game_hotkey.help=Abre o menu de jogo do nds-bootstrap. O retorno depende do jogo e do backend; QUIT_PATH aponta para BOOT.NDS.
dialog.game_language.help=Idioma do jogo, quando disponível. Não altera o idioma do Gloam nem o do menu durante o jogo.
dialog.game_manual.help=O manual .txt é Game.txt ao lado de Game.nds. Arquivos ausentes ou vazios limpam o caminho antigo. Desativado limpa; Manter INI não altera.
dialog.game_mode.help=Modo DS ou DSi do backend. Auto mantém o padrão. A escolha não adiciona recursos de hardware ausentes.
dialog.game_overlay_language.help=Idioma do menu de jogo do nds-bootstrap, independente do jogo. Manter INI usa o valor salvo ou o padrão do backend.
dialog.game_screen_swap.help=Segure esta combinação para trocar as telas pelo nds-bootstrap. Manter INI usa a combinação salva ou L+R+Cima+X.
dialog.game_size.help=Auto usa tamanhos DS conhecidos ou os do cabeçalho DSiWare. Jogos DS desconhecidos precisam de um tamanho definido. Saves existentes nunca são redimensionados.
dialog.game_vram.help=O aumento de VRAM é uma opção do backend. Auto mantém o padrão; alguns jogos precisam dele desativado.
setting.about.help=Interface BlocksDS para homebrews, áudio e temas. Iniciar jogos DS, salvar e retornar foram testados no DSi.
setting.audio.help=Áudio ausente ou incompatível fica em silêncio. A navegação continua disponível.
setting.auto_launch.help=Desativado por padrão. Na próxima inicialização, uma contagem abre o último título. Qualquer entrada cancela; a recuperação SELECT ignora. Teste o título manualmente antes.
setting.battery.help=Nível bruto da bateria (0-15) e estado de carga. Não é uma porcentagem.
setting.bottom_background.help=Escolha uma imagem para a tela de toque. Controles e áreas de toque mantêm suas posições.
setting.brightness.help=Iluminação de 1 a 5. No DSi, esta configuração é salva no console, separada do tema.
setting.cheats.help=Escolha códigos usrcheat.dat para a revisão do jogo. O banco de dados não é alterado. Os efeitos dependem do código e do título; veja o guia de cheats.
setting.clear_caches.help=Limpe ícones preparados e caches de imagens. Imagens originais, associações e saves continuam no SD.
setting.clear_recent.help=Limpe o histórico de inicializações. Favoritos, conteúdo e saves são mantidos.
setting.config_export.help=Exporte configurações e associações para configuration/export.dsconfig. Apps, imagens e saves não são incluídos.
setting.config_import.help=Confira um arquivo .dsconfig e confirme. As configurações atuais são copiadas antes da importação. Indisponível na recuperação.
setting.dashboard.help=Mostre, oculte, ordene e limite seções da tela inicial. L/R altera a quantidade de itens. As configurações continuam acessíveis.
setting.diagnostics.help=Grave dados de execução em _nds/dsi-frontend/diagnostics.txt. BIOS, NAND, chaves e arquivos de conteúdo não são exportados.
setting.environment.help=Modo DS/DSi detectado. Isso não identifica o bootloader nem garante suporte a títulos do sistema.
setting.filter.help=Mostre todos os arquivos ou apenas jogos, mídias e documentos reconhecidos. Capas continuam ocultas como recursos.
setting.launch.help=Homebrew direto pelo SD do DSi e argv são suportados. Retornar exige um app compatível; veja o guia de inicialização.
setting.loaders.help=Padrões do nds-bootstrap, slots e teclas do menu. Iniciar, salvar e retornar foram testados no DSi; a compatibilidade varia por título.
setting.music_path.help=Escolha WAV PCM16 mono de 8-48 kHz, até 1 MiB. A faixa se repete sem outro app.
setting.preset_load.help=Aplique a aparência selecionada. Navegação, opções de jogo, associações e saves são mantidos.
setting.preset_save.help=Salve a aparência no slot selecionado. A versão anterior fica como cópia de segurança.
setting.preset_slot.help=Escolha Everyday, Evening ou Travel. Cada slot guarda tema, fundos, ícones, visualização e legibilidade.
setting.profiles.help=Perfis INI definem ícones e apps. Edite aqui as associações pessoais de extensões.
setting.refresh.help=Recarregue temas, associações e esta pasta; limpe o cache de imagens. A seleção é mantida se ainda estiver visível.
setting.reset_appearance.help=Restaure a aparência integrada. Temas e imagens originais ficam no SD.
setting.reset_browser.help=Restaure ordem, visibilidade, extensões, idioma dos títulos e rolagem. Bibliotecas, abas, favoritos e aparência são mantidos.
setting.reset_configuration.help=Restaure configurações e associações. Confirme novamente com A. As antigas são arquivadas; apps, saves, temas e imagens são mantidos.
setting.reset_wallpapers.help=Remova fundos pessoais e use os do tema. Nenhuma imagem ou tema é apagado.
setting.route_camera.help=Detecte a Câmera e sua rota de inicialização. O comportamento depende do ambiente de boot. A atualiza a detecção.
setting.route_direct.help=Início direto pelo SD do DSi. argv e retorno dependem do app. A verifica as rotas novamente.
setting.route_download.help=Detecte DS Download Play e sua rota. Transferências sem fio exigem outros aparelhos compatíveis e testes separados. A atualiza a detecção.
setting.route_homebrew.help=Verifica /_nds/nds-bootstrap-hb-release.nds para perfis que o utilizam. A maioria dos apps inicia diretamente. A atualiza.
setting.route_menu.help=Verifica o Menu DSi e, se existir, nand:/launcher.dsi. As configurações de boot da NAND não são alteradas. A atualiza.
setting.route_picto.help=Detecte PictoChat e sua rota. Comunicação local sem fio exige firmware e outros aparelhos compatíveis. A atualiza.
setting.route_retail.help=Verifica /_nds/nds-bootstrap-release.nds. Presente significa instalado, não testado com todos os jogos. A atualiza.
setting.route_settings.help=Abra as configurações instaladas pelo Menu DSi. Menus modificados podem exigir outro botão após iniciar. A atualiza.
setting.route_slot1.help=Verifique os caminhos do auxiliar e o programa escolhido. Um cartucho ainda é necessário. A atualiza.
setting.route_sound.help=Detecte o Sound e sua rota. Reprodução e gravação dependem do ambiente de boot. A atualiza.
setting.settings_mode.help=Simples mostra opções diárias. Avançado adiciona inicialização e manutenção. Trocar a visualização mantém as escolhas.
setting.sleep.help=A suspensão ao fechar está ativa. Retomada, tela, controles e música foram testados no DSi. Outros aparelhos ainda precisam de testes.
setting.sort.help=Pastas primeiro, depois arquivos por nome, extensão ou data. A seleção acompanha o caminho.
setting.speed.help=Ajuste a repetição ao segurar direções e L/R. Toques individuais continuam imediatos.
setting.startup.help=Abra a última aba ou uma aba escolhida na próxima inicialização. Isso não inicia um título.
setting.system.help=Abra a aba Sistema. Cada rota de inicialização mostra sua disponibilidade separadamente.
setting.system_files.help=Mostre arquivos com atributo de sistema FAT. Isso não permite editar ou apagar esses arquivos.
setting.system_menu.help=Retorne pelo Menu DSi instalado. Um menu traduzido validado tem prioridade. Em consoles modificados, siga o aviso.
setting.tabs.help=Edite raízes e abas em _nds/dsi-frontend/tabs.ini e reinicie. Os IDs preservam a navegação salva.
setting.title_language.help=Escolha o idioma dos títulos internos, com inglês e depois japonês como alternativa. Não traduz jogo nem interface; caracteres japoneses independem do tema.
setting.title_source.help=Mostre nomes de arquivos ou títulos DS carregados sob demanda. Ordem e inicialização usam o nome real do arquivo.
setting.toolchain.help=Versão do SDK desta compilação. Detalhes em docs/development/TOOLCHAIN.md.
setting.top_background.help=Escolha PNG/JPEG no SD. Fundos pessoais são mantidos ao trocar de tema; os originais não são alterados.
setting.top_content.help=Tema segue seu design. Vizinhos mostra capas próximas. Smart se adapta ao conteúdo. Y abre os detalhes.
setting.unlaunch.help=Abra seu instalador para aviso inicial, som do menu e opções de boot. As configurações dele são separadas das do Gloam.
setting.wall_strength.help=Padrão do tema, Desativado ou intensidade 5-35%. Fundos suaves mantêm o texto legível.
