[theme]
version=2
header=Eclipse
name=Eclipse

[colors]
background=#292137
surface=#44354b
line=#44354b
text=#fff0df
muted=#bcd5db
accent=#edb08d
ink=#25323b

[fonts]
ui=fonts/ui.dsfont
heading=fonts/heading.dsfont

[layout]
tab_style=pager
tab_highlight=skin
tab_visible=3
tab_gap=4
top_layout=poster
chrome=minimal
content_opacity=80
view=grid
icon_size=large
row_padding=12
large_grid_columns=2
top_content_opacity=100
bottom_content_opacity=100

[audio]
cursor=sounds/cursor.wav
confirm=sounds/confirm.wav
back=sounds/back.wav
music=sounds/loop.wav

[icons]
directory=icons

[components]
directory=components
border=8
alpha=coverage

[backgrounds]
top=backgrounds/scene-top.png
bottom=backgrounds/scene-bottom.png
strength=100
top_surface=backgrounds/reading-top.png
bottom_surface=backgrounds/reading-bottom.png

[assets]
prepared=assets.gfx
