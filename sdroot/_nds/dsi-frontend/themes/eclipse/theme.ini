[theme]
version=2
header=ECLIPSE
name=Eclipse

[colors]
background=#292137
surface=#44354b
line=#887891
text=#fff0df
muted=#bcd5db
accent=#edb08d
ink=#25323b

[fonts]
ui=fonts/ui.dsfont

[layout]
tab_style=pager
tab_highlight=outline
tab_visible=3
tab_gap=4
top_layout=poster
chrome=full
content_opacity=72
view=grid
icon_size=large
row_padding=12
large_grid_columns=2
top_content_opacity=60
bottom_content_opacity=58

[audio]
cursor=sounds/cursor.wav
confirm=sounds/confirm.wav
back=sounds/back.wav
music=sounds/loop.wav

[icons]
directory=icons

[components]
directory=components
border=8
alpha=coverage

[backgrounds]
top=backgrounds/scene-top.png
bottom=backgrounds/scene-bottom.png
strength=100

[assets]
prepared=assets.gfx
