[theme]
version=2
header=Ember
name=Ember

[colors]
background=#f2e2bf
surface=#e8d4ae
line=#e8d4ae
text=#3b3b2b
muted=#63563f
accent=#a23d27
ink=#fff3db

[fonts]
ui=fonts/ui.dsfont
heading=fonts/heading.dsfont

[layout]
tab_style=numbered
tab_highlight=skin
tab_visible=3
tab_gap=6
top_layout=poster
chrome=minimal
content_opacity=80
view=extended
icon_size=large
row_padding=4
large_grid_columns=4
top_content_opacity=100
bottom_content_opacity=100

[audio]
music=sounds/loop.wav
cursor=sounds/cursor.wav
confirm=sounds/confirm.wav
back=sounds/back.wav

[icons]
directory=icons

[components]
fill=tile
directory=components
border=8
alpha=coverage
controls=on

[backgrounds]
top=backgrounds/scene-top.png
bottom=backgrounds/scene-bottom.png
strength=100
top_surface=backgrounds/reading-top.png
bottom_surface=backgrounds/reading-bottom.png

[assets]
prepared=assets.gfx
