[theme]
version=2
header=Field notes
name=Folio

[colors]
background=#f0e7cc
surface=#e4d6b3
line=#e4d6b3
text=#2c342f
muted=#56634e
accent=#8b402d
ink=#fff2d4

[fonts]
ui=fonts/ui.dsfont
heading=fonts/heading.dsfont

[layout]
tab_style=labels
tab_highlight=skin
tab_visible=3
tab_gap=4
top_layout=scene
chrome=minimal
content_opacity=80
view=list
icon_size=small
row_padding=0
large_grid_columns=4
top_content_opacity=100
bottom_content_opacity=100

[audio]
cursor=sounds/cursor.wav
confirm=sounds/confirm.wav
back=sounds/back.wav
music=sounds/loop.wav

[icons]
directory=icons

[components]
fill=stretch
material=components/material.png
focus_material=components/focus-material.png
directory=components
border=8
alpha=coverage
controls=on

[backgrounds]
top=backgrounds/scene-top.png
bottom=backgrounds/scene-bottom.png
strength=100
top_surface=backgrounds/reading-top.png
bottom_surface=backgrounds/reading-bottom.png

[assets]
prepared=assets.gfx
