[theme]
version=1
header=GARNET HALL
name=Garnet

[colors]
background=#190c13
surface=#321622
line=#6c354b
text=#ffedf1
muted=#d1a5b5
accent=#f396b2
ink=#300b1a

[fonts]
ui=fonts/ui.dsfont

[layout]
tab_style=labels
tab_highlight=outline
tab_visible=3
tab_gap=4
top_layout=scene
scene_cover_x=20
scene_cover_y=36
scene_cover_width=60
scene_cover_height=72
chrome=full
content_opacity=82
view=list
icon_size=small
row_padding=2
