[theme]
version=2
header=Garnet
name=Garnet

[colors]
background=#2e202a
surface=#49343c
line=#49343c
text=#fff0d4
muted=#ced5cc
accent=#edc28b
ink=#2d2930

[fonts]
ui=fonts/ui.dsfont
heading=fonts/heading.dsfont

[layout]
tab_style=labels
tab_highlight=skin
tab_visible=3
tab_gap=4
top_layout=scene
scene_cover_x=20
scene_cover_y=36
scene_cover_width=60
scene_cover_height=72
chrome=minimal
content_opacity=80
view=list
icon_size=small
row_padding=2
large_grid_columns=4
top_content_opacity=100
bottom_content_opacity=100

[audio]
music=sounds/loop.wav
cursor=sounds/cursor.wav
confirm=sounds/confirm.wav
back=sounds/back.wav

[icons]
directory=icons

[components]
directory=components
border=8
alpha=coverage
controls=on

[backgrounds]
top=backgrounds/scene-top.png
bottom=backgrounds/scene-bottom.png
strength=100
top_surface=backgrounds/reading-top.png
bottom_surface=backgrounds/reading-bottom.png

[assets]
prepared=assets.gfx
