[theme]
version=2
header=Nocturne
name=Nocturne

[colors]
background=#22263f
surface=#38394f
line=#38394f
text=#fff2d6
muted=#c4dbe1
accent=#f3ce88
ink=#1c2e40

[fonts]
ui=fonts/ui.dsfont
heading=fonts/heading.dsfont

[layout]
tab_style=labels
tab_highlight=skin
tab_visible=3
tab_gap=4
top_layout=scene
chrome=minimal
content_opacity=80
view=extended
icon_size=small
row_padding=2
large_grid_columns=4
top_content_opacity=100
bottom_content_opacity=100

[audio]
music=sounds/loop.wav
cursor=sounds/cursor.wav
confirm=sounds/confirm.wav
back=sounds/back.wav

[icons]
directory=icons

[components]
fill=stretch
material=components/material.png
focus_material=components/focus-material.png
directory=components
border=8
alpha=coverage
controls=on

[backgrounds]
top=backgrounds/scene-top.png
bottom=backgrounds/scene-bottom.png
strength=100
top_surface=backgrounds/reading-top.png
bottom_surface=backgrounds/reading-bottom.png

[assets]
prepared=assets.gfx
