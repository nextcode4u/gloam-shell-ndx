[theme]
version=2
header=Phosphor
name=Phosphor

[colors]
background=#14232d
surface=#263943
line=#263943
text=#f0f0d6
muted=#bad0cb
accent=#b9e18d
ink=#192d2d

[fonts]
ui=fonts/ui.dsfont
heading=fonts/heading.dsfont

[layout]
tab_style=numbered
tab_highlight=skin
tab_visible=3
tab_gap=4
top_layout=sidebar
chrome=minimal
content_opacity=80
view=classic
icon_size=small
row_padding=0
large_grid_columns=4
top_content_opacity=100
bottom_content_opacity=100

[audio]
cursor=sounds/cursor.wav
confirm=sounds/confirm.wav
back=sounds/back.wav

[icons]
directory=icons

[components]
fill=stretch
material=components/material.png
focus_material=components/focus-material.png
directory=components
border=8
alpha=coverage
controls=on

[backgrounds]
top=backgrounds/scene-top.png
bottom=backgrounds/scene-bottom.png
strength=100
top_surface=backgrounds/reading-top.png
bottom_surface=backgrounds/reading-bottom.png

[assets]
prepared=assets.gfx
