[theme]
version=1
header=Prism library
name=Prism

[colors]
background=#f2f4fb
surface=#d8dfed
line=#8c9bb8
text=#16223b
muted=#475777
accent=#334ba0
ink=#ffffff

[fonts]
ui=fonts/ui.dsfont

[layout]
top_layout=sidebar_left
chrome=full
content_opacity=40
view=grid
icon_size=large
row_padding=0
large_grid_columns=4

[backgrounds]
top=backgrounds/top.png
bottom=backgrounds/bottom.jpg
strength=70

[audio]
cursor=sounds/cursor.wav
confirm=sounds/confirm.wav
back=sounds/back.wav
music=sounds/loop.wav

[icons]
directory=icons

[components]
directory=components
border=8
