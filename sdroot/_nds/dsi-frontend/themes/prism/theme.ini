[theme]
version=2
header=Prism
name=Prism

[colors]
background=#fff2f7
surface=#fff7f3
line=#fff7f3
text=#302d45
muted=#67455c
accent=#b60051
ink=#fff4f7

[fonts]
ui=fonts/ui.dsfont
heading=fonts/heading.dsfont

[layout]
tab_style=labels
tab_highlight=skin
tab_visible=3
tab_gap=8
top_layout=spotlight
chrome=minimal
content_opacity=80
view=grid
icon_size=large
row_padding=0
large_grid_columns=4
top_content_opacity=100
bottom_content_opacity=100

[audio]
cursor=sounds/cursor.wav
confirm=sounds/confirm.wav
back=sounds/back.wav
music=sounds/loop.wav

[icons]
directory=icons

[components]
directory=components
border=8
alpha=coverage
controls=on

[backgrounds]
top=backgrounds/scene-top.png
bottom=backgrounds/scene-bottom.png
strength=100
top_surface=backgrounds/reading-top.png
bottom_surface=backgrounds/reading-bottom.png

[assets]
prepared=assets.gfx
