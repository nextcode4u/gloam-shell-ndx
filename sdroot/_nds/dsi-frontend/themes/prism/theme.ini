[theme]
version=1
header=PRISM ARCADE
name=Prism

[colors]
background=#f2f4fb
surface=#d8dfed
line=#8c9bb8
text=#16223b
muted=#475777
accent=#334ba0
ink=#ffffff

[fonts]
ui=fonts/ui.dsfont

[layout]
top_layout=scene
chrome=full
content_opacity=82
view=grid
icon_size=large
row_padding=0
large_grid_columns=4


[audio]
cursor=sounds/cursor.wav
confirm=sounds/confirm.wav
back=sounds/back.wav
music=sounds/loop.wav

[icons]
directory=icons

[components]
directory=components
border=8

[backgrounds]
top=backgrounds/scene-top.png
bottom=backgrounds/scene-bottom.png
strength=100
