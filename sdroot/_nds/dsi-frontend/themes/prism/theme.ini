[theme]
version=2
header=PRISM ARCADE
name=Prism

[colors]
background=#f6ecd6
surface=#e3dfd2
line=#8a969c
text=#293346
muted=#535e74
accent=#a53b54
ink=#fff4df

[fonts]
ui=fonts/ui.dsfont

[layout]
tab_style=icons
tab_highlight=outline
