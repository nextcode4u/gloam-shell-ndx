[theme]
version=2
header=Tidelight
name=Tide

[colors]
background=#eee3c8
surface=#e0d4b6
line=#e0d4b6
text=#173344
muted=#46646c
accent=#a74332
ink=#fff7df

[fonts]
ui=fonts/ui.dsfont
heading=fonts/heading.dsfont

[layout]
tab_style=labels
tab_highlight=skin
tab_visible=3
tab_gap=8
top_layout=scene
scene_cover_x=14
scene_cover_y=30
scene_cover_width=68
scene_cover_height=84
chrome=minimal
content_opacity=80
view=grid
icon_size=large
row_padding=6
large_grid_columns=3
top_content_opacity=100
bottom_content_opacity=100

[audio]
music=sounds/loop.wav
cursor=sounds/cursor.wav
confirm=sounds/confirm.wav
back=sounds/back.wav

[icons]
directory=icons

[components]
fill=stretch
material=components/material.png
focus_material=components/focus-material.png
directory=components
border=8
alpha=coverage
controls=on

[backgrounds]
top=backgrounds/scene-top.png
bottom=backgrounds/scene-bottom.png
strength=100
top_surface=backgrounds/reading-top.png
bottom_surface=backgrounds/reading-bottom.png

[assets]
prepared=assets.gfx
