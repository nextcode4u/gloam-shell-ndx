[project]
site_name = "Gloam Shell NDX"
site_description = "Install Gloam, add your games and find a theme for your Nintendo DSi."
site_url = "https://nextcode4u.github.io/gloam-shell-ndx/"
docs_dir = "build/docs-source"
site_dir = "build/site"
extra_css = ["stylesheets/gloam.css"]
extra_javascript = ["javascripts/showcase.js", "javascripts/starfield.js"]
# Detailed references remain linked and searchable, outside the main menu.
not_in_nav = """
README.md
GETTING_STARTED.md
CURRENT_SUPPORT.md
SOURCE_MAP.md
guides/**
development/**
"""
nav = [
  { "Home" = "index.md" },
  { "Install" = "INSTALL.md" },
  { "Using Gloam" = "USING.md" },
  { "Themes" = "THEMES.md" },
  { "Help" = "HELP.md" },
  { "Glossary" = "GLOSSARY.md" },
]

[project.theme]
variant = "modern"
font = false
logo = "images/gloam.png"
favicon = "images/gloam.png"
features = [
  "navigation.tabs", "navigation.sections", "navigation.top",
  "navigation.tracking", "content.code.copy",
  "search.highlight", "search.suggest", "toc.follow",
]

# Dark by default, regardless of the operating system's color preference.
[[project.theme.palette]]
scheme = "slate"
primary = "deep purple"
accent = "deep purple"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
primary = "deep purple"
accent = "deep purple"
toggle.icon = "material/weather-night"
toggle.name = "Switch to dark mode"

[project.markdown_extensions]
admonition = {}
def_list = {}
attr_list = {}
md_in_html = {}
toc = { permalink = true }
"pymdownx.details" = {}
"pymdownx.highlight" = { anchor_linenums = true }
"pymdownx.superfences" = {}
